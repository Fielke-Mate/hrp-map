<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Pyrenees traverse planner — GR10 · GR11 · HRP</title>
<link rel="stylesheet" href="./leaflet.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a1622;color:#d0e0f0;font:13px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
#top{padding:9px 14px;border-bottom:1px solid #1e3247;background:#0d1c2b;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
h1{font-size:15px;color:#fff;font-weight:600}
#routeToggles{display:flex;gap:6px}
.rt{border-radius:6px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer;
  border:1px solid #2a4060;background:#12253a;color:#7a9ab8;user-select:none}
.rt.on{color:#fff}
.rt .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;opacity:.35}
.rt.on .dot{opacity:1}
.rt .len{font-weight:400;font-size:10.5px;opacity:.7;margin-left:5px}
#pickState{font-size:11.5px;color:#8aa4bc;margin-left:auto}
#pickState b{color:#7ad0f0}
#controls{display:flex;flex-wrap:wrap;gap:13px;align-items:flex-end;padding:9px 14px;
  border-bottom:1px solid #1e3247;background:#0e1e2e}
.ctl{display:flex;flex-direction:column;gap:3px}
.ctl label{font-size:10px;color:#7a9ab8;text-transform:uppercase;letter-spacing:.4px}
input[type=number]{background:#0f2030;color:#d0e0f0;border:1px solid #2a4060;
  border-radius:5px;padding:5px 7px;font:inherit;font-size:12px;width:78px}
.types{display:flex;gap:7px;flex-wrap:wrap}
.types label{display:flex;align-items:center;gap:3px;font-size:11px;color:#bcd4e6;
  text-transform:none;letter-spacing:0;cursor:pointer}
button{background:#1e4a6b;color:#dff0ff;border:1px solid #3a7ca8;border-radius:6px;
  padding:7px 13px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
button:hover{background:#2a5f88}
button.sec{background:#162a3d;border-color:#2a4060;color:#9ab8d0;font-weight:500}
button:disabled{opacity:.4;cursor:default}
#main{display:flex;height:calc(100vh - 168px);min-height:360px}
#map{flex:1;background:#101f2e;position:relative}
#side{width:340px;overflow-y:auto;border-left:1px solid #1e3247;background:#0b1a28}
#summary{padding:10px 12px;border-bottom:1px solid #1e3247}
#summary .big{font-size:19px;color:#fff;font-weight:600}
#summary .row{color:#8aa4bc;font-size:11px;margin-top:2px}
#msg{padding:10px 12px;font-size:11.5px;line-height:1.6}
#msg.warn{background:#3a2410;border-bottom:1px solid #8a5a20;color:#ffcf90}
#msg.err{background:#3a1616;border-bottom:1px solid #8a2020;color:#ffb0b0}
#msg.hint{background:#10283a;border-bottom:1px solid #2a4060;color:#9ab8d0}
.day{padding:9px 12px;border-bottom:1px solid #16293a;cursor:pointer}
.day:hover{background:#102030}
.day .n{font-size:10px;color:#7a9ab8;text-transform:uppercase;letter-spacing:.4px}
.day .to{font-size:13px;color:#fff;font-weight:600;margin:1px 0}
.day .st{color:#9ab8d0;font-size:11.5px}
.tag{display:inline-block;border-radius:3px;padding:0 4px;font-size:9.5px;
  font-weight:700;margin-right:4px}
.badge{border-radius:3px;width:19px;height:19px;line-height:17px;text-align:center;
  font-size:11px;font-weight:700;border:2px solid}
.pin{width:15px;height:15px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 5px #000a}
#legend{position:absolute;bottom:10px;left:10px;z-index:900;background:#12253ae6;
  border:1px solid #2a4060;border-radius:7px;padding:7px 9px;font-size:10.5px}
#legend div{display:flex;align-items:center;gap:6px;margin:2px 0}
#zoomhint{position:absolute;bottom:10px;right:10px;z-index:900;background:#12253ae6;
  border:1px solid #2a4060;border-radius:7px;padding:5px 9px;font-size:10.5px;color:#9ab8d0}
.leaflet-popup-content-wrapper{background:#1a2d3f;border:1px solid #2a4060;color:#d0e0f0}
.leaflet-popup-tip{background:#1a2d3f}
.leaflet-popup-content{font-size:12px;margin:9px 12px}
.leaflet-popup-content h4{color:#7ad0f0;font-size:12.5px;margin-bottom:3px}
.leaflet-popup-content .m{color:#9ab8d0;font-size:11px}
</style>
</head>
<body>

<div id="top">
  <h1>Pyrenees traverse planner</h1>
  <div id="routeToggles"></div>
  <div id="pickState">Click a route line to set your <b>start</b></div>
</div>

<div id="controls">
  <div class="ctl"><label for="startKm">Start (km)</label><input type="number" id="startKm" value="0" min="0" step="1"></div>
  <div class="ctl"><label for="endKm">Finish (km)</label><input type="number" id="endKm" value="150" min="1" step="1"></div>
  <div class="ctl"><label for="minKm">Day min</label><input type="number" id="minKm" value="10" min="1" step="1"></div>
  <div class="ctl"><label for="maxKm">Day max</label><input type="number" id="maxKm" value="20" min="2" step="1"></div>
  <div class="ctl"><label for="maxAsc">Max climb (m)</label><input type="number" id="maxAsc" value="1600" min="0" step="100"></div>
  <div class="ctl"><label>Will sleep in</label><div class="types" id="types"></div></div>
  <div class="ctl"><label>&nbsp;</label><button id="go">Plan it</button></div>
  <div class="ctl"><label>&nbsp;</label><button id="whole" class="sec">Whole route</button></div>
  <div class="ctl"><label>&nbsp;</label><button id="clear" class="sec">Clear pins</button></div>
  <div class="ctl"><label>&nbsp;</label><button id="gpx" class="sec">Export GPX</button></div>
</div>

<div id="main">
  <div id="map"><div id="legend"></div><div id="zoomhint"></div></div>
  <div id="side">
    <div id="summary"><div class="big">Loading…</div></div>
    <div id="msg"></div>
    <div id="days"></div>
  </div>
</div>

<script src="./leaflet.js"></script>
<script>
// ---------------------------------------------------------------------------
// Pyrenees traverse planner.
//
// A route is one polyline; everything else is an interval or a point measured
// in km along it. Days are derived from the chosen stops, never stored, which
// is what lets one geometry serve any start, finish and daily range.
// ---------------------------------------------------------------------------

const TYPES = {
  R: {label:'Staffed refuge',  bg:'#1a7a40', bd:'#80f0b0', fg:'#fff', on:true},
  C: {label:'Unattended hut',  bg:'#b85e10', bd:'#ffd080', fg:'#fff', on:true},
  A: {label:'Bare shelter',    bg:'#5a3060', bd:'#c080ff', fg:'#ddb0ff', on:true},
  G: {label:'Gîte / albergue', bg:'#1c5c8a', bd:'#7ad0f0', fg:'#fff', on:true},
  B: {label:'Campsite',        bg:'#4a6a20', bd:'#b0e060', fg:'#fff', on:true},
  H: {label:'Hotel / guesthouse', bg:'#5a5a5a', bd:'#a0a0a0', fg:'#ddd', on:false}
};
// H is off by default: excluding it leaves GR10's worst gap unchanged at
// 13.4 km, and it clutters every village.

const ROUTE_META = {
  hrp:  {name:'HRP',  full:'Haute Randonnée Pyrénéenne', colour:'#7ad0f0', on:true},
  gr10: {name:'GR10', full:'GR 10 — French side',        colour:'#f0a050', on:false},
  gr11: {name:'GR11', full:'GR 11 — Spanish side',       colour:'#e070c0', on:false}
};
const SHELTER_ZOOM = 10;      // below this the badges merge into a solid mass

const map = L.map('map', {zoomControl:true}).setView([42.75, 0.6], 8);
L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
  attribution:'Kartendaten: © OpenStreetMap-Mitwirkende, SRTM | Kartendarstellung: © OpenTopoMap (CC-BY-SA)',
  crossOrigin:true, maxZoom:17, opacity:0.85
}).addTo(map);

const R = {};                          // loaded routes by id
let SHELTERS = null;
let active = 'hrp';                    // the route being planned
let pick = {start:null, end:null};     // {route, km}
let PLAN = null;
const lines = {};
const layers = {shelters:L.layerGroup().addTo(map), stops:L.layerGroup().addTo(map),
                pins:L.layerGroup().addTo(map)};

function kmBetween(a, b){
  const dlat = (b[0]-a[0])*111.0;
  const dlon = (b[1]-a[1])*111.0*Math.cos((a[0]+b[0])/2*Math.PI/180);
  return Math.sqrt(dlat*dlat + dlon*dlon);
}
function esc(t){ return String(t == null ? '' : t)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function idxAtKm(rt, km){
  const c = rt.cum;
  let lo = 0, hi = c.length - 1;
  while (lo < hi){ const m = (lo+hi)>>1; if (c[m] < km) lo = m+1; else hi = m; }
  return lo;
}
function eleAtKm(rt, km){
  const i = idxAtKm(rt, km), p = rt.points, c = rt.cum;
  if (i <= 0) return p[0][2];
  const span = c[i] - c[i-1], t = span > 0 ? (km - c[i-1]) / span : 0;
  return p[i-1][2] + t * (p[i][2] - p[i-1][2]);
}
function llAtKm(rt, km){
  const i = idxAtKm(rt, km), p = rt.points, c = rt.cum;
  if (i <= 0) return [p[0][0], p[0][1]];
  const span = c[i] - c[i-1], t = span > 0 ? (km - c[i-1]) / span : 0;
  return [p[i-1][0] + t*(p[i][0]-p[i-1][0]), p[i-1][1] + t*(p[i][1]-p[i-1][1])];
}
// Resampled to a fixed interval before the 3 m threshold, so the figure does
// not grow with how densely the track happens to be sampled.
function ascentBetween(rt, a, b){
  let up = 0, dn = 0, prev = eleAtKm(rt, a);
  for (let k = a + 0.025; k <= b; k += 0.025){
    const e = eleAtKm(rt, k), d = e - prev;
    if (Math.abs(d) > 3){ if (d > 0) up += d; else dn -= d; prev = e; }
  }
  return {up:Math.round(up), dn:Math.round(dn)};
}
function nearestKmOn(rt, ll){
  let best = Infinity, bi = 0;
  const step = 4;
  for (let i = 0; i < rt.points.length; i += step){
    const d = kmBetween(ll, rt.points[i]);
    if (d < best){ best = d; bi = i; }
  }
  for (let i = Math.max(0, bi-step); i < Math.min(rt.points.length, bi+step+1); i++){
    const d = kmBetween(ll, rt.points[i]);
    if (d < best){ best = d; bi = i; }
  }
  return {km: rt.cum[bi], off: best};
}

// --- the planner ----------------------------------------------------------
// Candidate stops form a DAG ordered by km; an edge exists where the day
// between them satisfies every constraint; the itinerary is the cheapest
// path. Greedy "walk the target distance, take the nearest hut" paints itself
// into corners and leaves an impossible final day.
function autoPlan(rt, startKm, endKm, opts){
  const cand = rt.shelters.filter(s => s.km > startKm + 0.3 && s.km < endKm - 0.3
                                  && opts.types.has(s.type) && s.offM <= opts.maxOffM);
  const nodes = [{km:startKm, offM:0, label:'Start', type:null}]
    .concat(cand).concat([{km:endKm, offM:0, label:'Finish', type:null}]);
  const N = nodes.length, INF = Infinity;
  const cost = new Array(N).fill(INF), prev = new Array(N).fill(-1);
  cost[0] = 0;
  const dayOf = (a, b) => {
    const trackKm = nodes[b].km - nodes[a].km;
    const detour = (nodes[a].offM + nodes[b].offM) / 1000;
    const asc = ascentBetween(rt, nodes[a].km, nodes[b].km);
    return {trackKm, detour, km:trackKm + detour, up:asc.up, dn:asc.dn};
  };
  for (let i = 0; i < N; i++){
    if (cost[i] === INF) continue;
    for (let j = i + 1; j < N; j++){
      const d = dayOf(i, j);
      if (d.trackKm > opts.maxKm) break;
      if (d.km > opts.maxKm) continue;
      if (d.km < opts.minKm && j < N - 1) continue;
      if (opts.maxAsc > 0 && d.up > opts.maxAsc) continue;
      const ideal = (opts.minKm + opts.maxKm) / 2;
      const c = Math.abs(d.km - ideal) + (nodes[j].offM / 1000) * 2
              + (opts.maxAsc > 0 ? Math.max(0, d.up - opts.maxAsc*0.85) / 120 : 0);
      if (cost[i] + c < cost[j]){ cost[j] = cost[i] + c; prev[j] = i; }
    }
  }
  if (cost[N-1] === INF){
    let far = 0;
    for (let i = 0; i < N; i++) if (cost[i] < INF && nodes[i].km > nodes[far].km) far = i;
    let best = null;
    for (let j = far + 1; j < N; j++){
      const d = dayOf(far, j), reasons = [];
      if (d.km > opts.maxKm) reasons.push('distance');
      if (opts.maxAsc > 0 && d.up > opts.maxAsc) reasons.push('climb');
      if (!reasons.length) continue;
      if (!best) best = {node:nodes[j], d:d, reasons:reasons};
    }
    if (!best) best = {node:nodes[N-1], d:dayOf(far, N-1), reasons:['distance']};
    return {ok:false, stuckAt:nodes[far], next:best.node, day:best.d, reasons:best.reasons};
  }
  const path = [];
  for (let i = N-1; i >= 0; i = prev[i]){ path.unshift(nodes[i]); if (i === 0) break; }
  const days = [];
  for (let i = 1; i < path.length; i++){
    const a = path[i-1], b = path[i];
    const trackKm = b.km - a.km, detour = (a.offM + b.offM)/1000;
    const asc = ascentBetween(rt, a.km, b.km);
    days.push({from:a, to:b, trackKm, detour, km:trackKm+detour, up:asc.up, dn:asc.dn,
               hours:(trackKm+detour)/4 + asc.up/600});
  }
  return {ok:true, stops:path, days:days};
}

// --- rendering ------------------------------------------------------------
function badge(t){
  const s = TYPES[t] || TYPES.A;
  return L.divIcon({className:'', iconSize:[19,19], iconAnchor:[9.5,9.5],
    html:'<div class="badge" style="background:'+s.bg+';border-color:'+s.bd+';color:'+s.fg+'">'+t+'</div>'});
}
function pinIcon(colour){
  return L.divIcon({className:'', iconSize:[15,15], iconAnchor:[7.5,7.5],
    html:'<div class="pin" style="background:'+colour+'"></div>'});
}

function drawRoutes(){
  Object.keys(ROUTE_META).forEach(id => {
    if (lines[id]){ map.removeLayer(lines[id]); delete lines[id]; }
    const meta = ROUTE_META[id];
    if (!meta.on || !R[id]) return;
    const isActive = id === active;
    lines[id] = L.polyline(R[id].points.map(p => [p[0], p[1]]),
      {color:meta.colour, weight:isActive ? 4 : 2.5, opacity:isActive ? 0.95 : 0.5}).addTo(map);
    lines[id].on('click', ev => onLineClick(id, [ev.latlng.lat, ev.latlng.lng]));
  });
}

function drawShelters(){
  layers.shelters.clearLayers();
  const hint = document.getElementById('zoomhint');
  const rt = R[active];
  if (!rt) return;
  if (map.getZoom() < SHELTER_ZOOM){
    hint.textContent = 'Zoom in to see places to sleep';
    return;
  }
  const on = new Set(Object.keys(TYPES).filter(t => TYPES[t].on));
  const b = map.getBounds();
  let n = 0;
  rt.shelters.forEach(s => {
    if (!on.has(s.type) || !b.contains(L.latLng(s.ll[0], s.ll[1]))) return;
    n++;
    L.marker(s.ll, {icon:badge(s.type)})
     .bindPopup('<h4>' + esc(s.label) + '</h4><p class="m">'
       + (TYPES[s.type] ? TYPES[s.type].label : s.type)
       + (s.ele ? ' · ' + s.ele + ' m' : '')
       + '<br>' + ROUTE_META[active].name + ' km ' + s.km.toFixed(1)
       + ' · ' + s.offM + ' m off route'
       + (s.capacity ? '<br>capacity ' + esc(s.capacity) : '')
       + (s.confidence !== 'high' ? '<br><i>classified from incomplete tags ('
           + s.confidence + ' confidence)</i>' : '')
       + '<br><span style="color:#6a8398">' + esc(s.id) + '</span></p>')
     .addTo(layers.shelters);
  });
  hint.textContent = n + ' places to sleep in view · ' + ROUTE_META[active].name;
}

function drawPins(){
  layers.pins.clearLayers();
  ['start','end'].forEach(k => {
    const p = pick[k];
    if (!p || !R[p.route]) return;
    L.marker(llAtKm(R[p.route], p.km),
             {icon:pinIcon(k === 'start' ? '#50d080' : '#e05050'), zIndexOffset:900})
     .bindPopup('<h4>' + (k === 'start' ? 'Start' : 'Finish') + '</h4><p class="m">'
       + ROUTE_META[p.route].name + ' km ' + p.km.toFixed(1) + '</p>')
     .addTo(layers.pins);
  });
}

function onLineClick(id, ll){
  if (!R[id]) return;
  active = id;                                 // clicking a line plans on it
  const hit = nearestKmOn(R[id], ll);
  if (!pick.start || pick.start.route !== id || pick.end){
    pick = {start:{route:id, km:hit.km}, end:null};
    PLAN = null;
  } else {
    const a = Math.min(pick.start.km, hit.km), b = Math.max(pick.start.km, hit.km);
    pick = {start:{route:id, km:a}, end:{route:id, km:b}};
  }
  syncInputs(); drawRoutes(); drawPins(); updateToggles(); drawShelters();
  if (pick.start && pick.end) replan(); else render();
}

function syncInputs(){
  if (pick.start) document.getElementById('startKm').value = pick.start.km.toFixed(1);
  if (pick.end)   document.getElementById('endKm').value   = pick.end.km.toFixed(1);
  const st = document.getElementById('pickState');
  if (!pick.start) st.innerHTML = 'Click a route line to set your <b>start</b>';
  else if (!pick.end) st.innerHTML = 'Start <b>' + ROUTE_META[pick.start.route].name
    + ' km ' + pick.start.km.toFixed(1) + '</b> — now click your <b>finish</b>';
  else st.innerHTML = '<b>' + ROUTE_META[active].name + '</b> km '
    + pick.start.km.toFixed(1) + ' → ' + pick.end.km.toFixed(1)
    + ' <span style="color:#6a8398">(' + (pick.end.km - pick.start.km).toFixed(0) + ' km)</span>';
}

function updateToggles(){
  document.querySelectorAll('.rt').forEach(el => {
    const id = el.dataset.r;
    el.classList.toggle('on', !!ROUTE_META[id].on);
    el.style.borderColor = (id === active && ROUTE_META[id].on) ? ROUTE_META[id].colour : '#2a4060';
    const len = el.querySelector('.len');
    if (len) len.textContent = R[id] ? R[id].lengthKm.toFixed(0) + ' km' : '';
  });
}

function render(){
  const sum = document.getElementById('summary'), msg = document.getElementById('msg'),
        list = document.getElementById('days');
  layers.stops.clearLayers();
  list.innerHTML = ''; msg.className = ''; msg.innerHTML = '';
  document.getElementById('gpx').disabled = !(PLAN && PLAN.ok);
  const rt = R[active];

  if (!PLAN){
    sum.innerHTML = '<div class="big">' + (rt ? ROUTE_META[active].name : '—') + '</div>'
      + (rt ? '<div class="row">' + ROUTE_META[active].full + '</div><div class="row">'
            + rt.lengthKm.toFixed(0) + ' km · ' + rt.shelters.length
            + ' places to sleep within 2.5 km</div>' : '');
    msg.className = 'hint';
    msg.innerHTML = 'Click the route on the map to drop your <b>start</b>, then click again for '
      + 'your <b>finish</b> — or type kilometres above. Toggle GR10, GR11 and HRP at the top to '
      + 'compare them; clicking a line also makes it the one you are planning.';
    return;
  }
  if (!PLAN.ok){
    sum.innerHTML = '<div class="big">No plan possible</div>';
    msg.className = 'err';
    const d = PLAN.day, why = PLAN.reasons, bits = [];
    if (why.indexOf('distance') >= 0)
      bits.push('<b>' + d.km.toFixed(1) + ' km</b> door to door'
        + (d.detour > 0.05 ? ' (' + d.trackKm.toFixed(1) + ' km on the route plus '
            + (d.detour*1000).toFixed(0) + ' m of detours)' : '')
        + ', above your ' + document.getElementById('maxKm').value + ' km maximum');
    if (why.indexOf('climb') >= 0)
      bits.push('<b>' + d.up + ' m</b> of climb, above your '
        + document.getElementById('maxAsc').value + ' m limit');
    msg.innerHTML = 'Stuck after <b>' + esc(PLAN.stuckAt.label) + '</b> (km '
      + PLAN.stuckAt.km.toFixed(1) + '). The next place you could sleep is <b>'
      + esc(PLAN.next.label) + '</b> at km ' + PLAN.next.km.toFixed(1) + ' — '
      + bits.join(', and ') + '.<br>Try: '
      + [].concat(
          why.indexOf('distance') >= 0 ? ['raise the daily maximum past ' + Math.ceil(d.km) + ' km'] : [],
          why.indexOf('climb') >= 0 ? ['raise the climb limit past ' + d.up + ' m'] : [],
          ['allow more shelter types', 'or plan a bivouac there']).join(', ') + '.';
    return;
  }
  const tot = PLAN.days.reduce((a,d) => a + d.km, 0);
  const up = PLAN.days.reduce((a,d) => a + d.up, 0);
  sum.innerHTML = '<div class="big">' + PLAN.days.length + ' days · ' + tot.toFixed(0) + ' km</div>'
    + '<div class="row">↑ ' + up.toLocaleString() + ' m · '
    + PLAN.days.reduce((a,d)=>a+d.hours,0).toFixed(0) + ' h walking (Naismith)</div>'
    + '<div class="row">' + ROUTE_META[active].full + ' · km '
    + PLAN.stops[0].km.toFixed(0) + '–' + PLAN.stops[PLAN.stops.length-1].km.toFixed(0) + '</div>';

  PLAN.days.forEach((d, i) => {
    const el = document.createElement('div');
    el.className = 'day';
    const t = d.to.type;
    el.innerHTML = '<div class="n">Day ' + (i+1) + '</div>'
      + '<div class="to">' + (t ? '<span class="tag" style="background:'+TYPES[t].bg
          +';color:'+TYPES[t].fg+'">'+t+'</span>' : '') + esc(d.to.label) + '</div>'
      + '<div class="st">' + d.km.toFixed(1) + ' km · ↑' + d.up + ' m · ↓' + d.dn + ' m · ~'
      + d.hours.toFixed(1) + ' h'
      + (d.detour > 0.05 ? '<br><span style="color:#ffcf90">includes '
          + (d.detour*1000).toFixed(0) + ' m off route</span>' : '')
      + (d.to.ele ? '<br>' + d.to.ele + ' m · km ' + d.to.km.toFixed(1) : '') + '</div>';
    el.onclick = () => map.fitBounds(
      L.latLngBounds(llAtKm(rt, d.from.km), llAtKm(rt, d.to.km)), {padding:[45,45]});
    list.appendChild(el);
  });
  PLAN.stops.forEach((s, i) => {
    if (!s.type) return;
    L.marker(s.ll || llAtKm(rt, s.km), {icon:badge(s.type), zIndexOffset:600})
     .bindPopup('<h4>Night ' + i + ' — ' + esc(s.label) + '</h4>').addTo(layers.stops);
  });
  const low = PLAN.stops.filter(s => s.confidence && s.confidence !== 'high');
  if (low.length){
    msg.className = 'warn';
    msg.innerHTML = '⚠ ' + low.length + ' of your stops ' + (low.length===1?'is':'are')
      + ' classified from incomplete OSM tags: ' + low.map(s=>esc(s.label)).join(', ')
      + '. Treat the type as a best guess and check before relying on it.';
  }
}

function replan(){
  const rt = R[active];
  if (!rt){ PLAN = null; render(); return; }
  const types = new Set(Object.keys(TYPES).filter(t => TYPES[t].on));
  const a = Math.max(0, +document.getElementById('startKm').value);
  const b = Math.min(rt.lengthKm, +document.getElementById('endKm').value);
  if (!(b > a)){ PLAN = null; render(); return; }
  pick = {start:{route:active, km:a}, end:{route:active, km:b}};
  PLAN = autoPlan(rt, a, b, {types, maxOffM:2500,
    minKm:+document.getElementById('minKm').value,
    maxKm:+document.getElementById('maxKm').value,
    maxAsc:+document.getElementById('maxAsc').value});
  syncInputs(); drawPins(); render();
}

function exportGPX(){
  if (!PLAN || !PLAN.ok) return;
  const rt = R[active];
  const a = PLAN.stops[0].km, b = PLAN.stops[PLAN.stops.length-1].km;
  const pts = rt.points.slice(idxAtKm(rt, a), idxAtKm(rt, b) + 1);
  const out = ['<?xml version="1.0" encoding="UTF-8"?>',
    '<gpx version="1.1" creator="Pyrenees traverse planner" xmlns="http://www.topografix.com/GPX/1/1">',
    '  <metadata><name>' + esc(ROUTE_META[active].full) + ' km ' + a.toFixed(0) + '–'
      + b.toFixed(0) + '</name><time>' + new Date().toISOString().replace(/\.\d+Z$/,'Z')
      + '</time></metadata>'];
  PLAN.stops.forEach((s, i) => {
    if (!s.type) return;
    const ll = s.ll || llAtKm(rt, s.km);
    out.push('  <wpt lat="' + ll[0].toFixed(6) + '" lon="' + ll[1].toFixed(6) + '">'
      + (s.ele ? '<ele>' + s.ele + '</ele>' : '')
      + '<name>' + esc('Night ' + i + ' – ' + s.label) + '</name><sym>Lodging</sym></wpt>');
  });
  out.push('  <trk><name>' + esc(ROUTE_META[active].full) + '</name><trkseg>');
  pts.forEach(p => out.push('    <trkpt lat="' + p[0].toFixed(6) + '" lon="' + p[1].toFixed(6)
    + '"><ele>' + p[2] + '</ele></trkpt>'));
  out.push('    </trkseg>', '  </trk>', '</gpx>');
  const blob = new Blob([out.join('\n')], {type:'application/gpx+xml'});
  const url = URL.createObjectURL(blob);
  const el = document.createElement('a');
  el.href = url; el.download = active + '-km' + a.toFixed(0) + '-' + b.toFixed(0) + '.gpx';
  document.body.appendChild(el); el.click(); document.body.removeChild(el);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

async function ensureRoute(id){
  if (R[id]) return R[id];
  const r = await fetch('./data/routes/' + id + '.json').then(x => x.json());
  const cum = [0];
  for (let i = 1; i < r.points.length; i++) cum.push(cum[i-1] + kmBetween(r.points[i-1], r.points[i]));
  const shelters = [];
  SHELTERS.forEach(s => {
    const o = s.on.find(o => o.route === id);
    if (o) shelters.push({id:s.id, label:s.label, type:s.type, ele:s.ele,
                          capacity:s.capacity, confidence:s.confidence,
                          ll:s.ll, km:o.km, offM:o.offM});
  });
  shelters.sort((a,b) => a.km - b.km);
  R[id] = {id:r.id, name:r.name, points:r.points, cum,
           lengthKm:cum[cum.length-1], stages:r.stages, shelters};
  return R[id];
}

(async function init(){
  const tbox = document.getElementById('types');
  Object.keys(TYPES).forEach(t => {
    const l = document.createElement('label');
    l.innerHTML = '<input type="checkbox" data-t="' + t + '"' + (TYPES[t].on ? ' checked' : '')
      + '> <span class="badge" style="display:inline-block;background:' + TYPES[t].bg
      + ';border-color:' + TYPES[t].bd + ';color:' + TYPES[t].fg + '">' + t + '</span>';
    l.title = TYPES[t].label;
    tbox.appendChild(l);
  });
  document.getElementById('legend').innerHTML = Object.keys(TYPES).map(t =>
    '<div><span class="badge" style="background:' + TYPES[t].bg + ';border-color:' + TYPES[t].bd
    + ';color:' + TYPES[t].fg + '">' + t + '</span> ' + TYPES[t].label + '</div>').join('');

  const tg = document.getElementById('routeToggles');
  Object.keys(ROUTE_META).forEach(id => {
    const m = ROUTE_META[id];
    const b = document.createElement('div');
    b.className = 'rt'; b.dataset.r = id; b.title = m.full;
    b.innerHTML = '<span class="dot" style="background:' + m.colour + '"></span>'
      + m.name + '<span class="len"></span>';
    b.onclick = async () => {
      if (m.on && active !== id){ active = id; }      // first click focuses it
      else if (m.on){                                  // already focused: hide it
        const other = Object.keys(ROUTE_META).find(k => k !== id && ROUTE_META[k].on);
        if (!other) return;                            // never hide the last one
        m.on = false; active = other;
      } else {
        m.on = true; await ensureRoute(id); active = id;
      }
      if (pick.start && pick.start.route !== active){
        pick = {start:null, end:null}; PLAN = null;
      }
      drawRoutes(); updateToggles(); drawShelters(); syncInputs(); drawPins(); render();
    };
    tg.appendChild(b);
  });

  SHELTERS = await fetch('./data/shelters.json').then(x => x.json()).then(d => d.shelters);
  await ensureRoute('hrp');
  drawRoutes(); updateToggles();
  map.fitBounds(lines.hrp.getBounds(), {padding:[20,20]});
  drawShelters();
  document.getElementById('endKm').value = Math.min(150, Math.floor(R.hrp.lengthKm));
  replan();

  document.getElementById('go').onclick = replan;
  document.getElementById('gpx').onclick = exportGPX;
  document.getElementById('clear').onclick = () => {
    pick = {start:null, end:null}; PLAN = null;
    syncInputs(); drawPins(); render(); drawShelters();
  };
  document.getElementById('whole').onclick = () => {
    document.getElementById('startKm').value = 0;
    document.getElementById('endKm').value = Math.floor(R[active].lengthKm);
    replan();
    if (lines[active]) map.fitBounds(lines[active].getBounds(), {padding:[20,20]});
  };
  tbox.onchange = e => { TYPES[e.target.dataset.t].on = e.target.checked; drawShelters(); replan(); };
  ['startKm','endKm','minKm','maxKm','maxAsc'].forEach(id =>
    document.getElementById(id).onchange = replan);
  map.on('moveend', drawShelters);
  window.__plannerReady = true;
})();
</script>
