// GPS needs no signal, and the planner now works without one, so this is the
// on-trail view: where you are along the route and what is left of today.
// The position never leaves the device - nothing here sends it anywhere.
//
// Carried over from the original tool, each from a real failure: browsers only
// release GPS in a secure context (opening the page from Android's Downloads
// list hands Chrome a content:// URI and the request dies silently), so that is
// checked up front; a timeout keeps retrying, a refusal does not.
//
// Improved on it: distance to the next stop includes your own walk back to the
// route and the detour to the hut, and the climb is the ascent ALONG the route,
// not the height difference - a hut 200 m below you can still be 800 m of
// climbing away. Only huts with nothing recorded against them are suggested.
// ---------------------------------------------------------------------------
(function(){
  let watching = false, firstFix = true, dot = null, ring = null, last = null;
  const ON_ROUTE_M = 60, LOST_KM = 2;

  const ctl = L.control({position:'topright'});
  ctl.onAdd = function(){
    const w = L.DomUtil.create('div');
    w.innerHTML = '<div id="geo-chip" title="Show where you are on the route (uses GPS, works with no signal)">'
                + '&#9678; My location</div><div id="geo-out" title="Tap to centre the map on you"></div>';
    L.DomEvent.disableClickPropagation(w);
    return w;
  };
  ctl.addTo(map);
  const chip = document.getElementById('geo-chip'), out = document.getElementById('geo-out');

  function say(html, warn){
    out.style.display = 'block';
    out.innerHTML = warn ? '<span class="warn">' + html + '</span>' : html;
  }
  function setChip(on, label){ chip.classList.toggle('on', on); chip.innerHTML = label; }

  function stop(){
    watching = false; firstFix = true; last = null;
    map.stopLocate();
    if (dot){ map.removeLayer(dot); dot = null; }
    if (ring){ map.removeLayer(ring); ring = null; }
    setChip(false, '&#9678; My location');
    out.style.display = 'none';
  }

  function start(){
    if (!navigator.geolocation){ say('This browser has no location support.', true); return; }
    if (window.isSecureContext === false){
      say('Blocked: the browser only gives out GPS to pages opened over <b>https</b>. '
        + 'Open the planner from its web address rather than a downloaded file.', true);
      return;
    }
    watching = true; firstFix = true;
    setChip(true, '&#9678; Locating&hellip;');
    say('Waiting for a GPS fix&hellip; about 30 s in the open, longer in a deep valley.');
    map.locate({watch:true, enableHighAccuracy:true, timeout:30000, maximumAge:10000, setView:false});
  }

  chip.addEventListener('click', () => { watching ? stop() : start(); });
  out.addEventListener('click', () => { if (last) map.setView(last, Math.max(map.getZoom(), 14)); });

  function fmtKm(k){ return k < 1 ? Math.round(k * 1000) + ' m' : k.toFixed(1) + ' km'; }

  // Pure: what to tell a hiker standing at ll. Kept separate from the GPS
  // plumbing so it reads as the rules it applies.
  function readout(ll, accM, altM){
    const rt = R[active];
    if (!rt) return 'No route loaded.';
    const me = nearestKmOn(rt, ll);
    const name = ROUTE_META[active].name;
    if (me.off > LOST_KM){
      // Far from the route being planned - say which visible route is nearest
      // rather than claiming a km position that means nothing.
      let near = null;
      Object.keys(ROUTE_META).forEach(id => {
        if (id === active || !ROUTE_META[id].on || !R[id]) return;
        const h = nearestKmOn(R[id], ll);
        if (!near || h.off < near.off) near = {id: id, km: h.km, off: h.off};
      });
      return '<span class="warn">' + fmtKm(me.off) + ' from the ' + name + '</span>'
        + (near && near.off < me.off ? '<br>Nearest shown route: <b>' + ROUTE_META[near.id].name
             + '</b> km ' + near.km.toFixed(1) + ', ' + fmtKm(near.off) + ' away' : '')
        + '<br>GPS &plusmn;' + Math.round(accM) + ' m';
    }
    const ele = (altM != null && isFinite(altM)) ? Math.round(altM) : Math.round(eleAtKm(rt, me.km));
    let html = '<b>' + name + ' km ' + me.km.toFixed(1) + '</b> &middot; ' + ele + ' m<br>'
      + (me.off * 1000 <= ON_ROUTE_M ? 'On the route'
                                     : '<span class="warn">' + fmtKm(me.off) + ' off the route</span>')
      + ' &middot; GPS &plusmn;' + Math.round(accM) + ' m';

    // Tonight's stop if a plan covers where you are; otherwise the next usable
    // place to sleep of a type you have switched on.
    let target = null, label = 'Next place to sleep';
    const inPlan = PLAN && PLAN.ok && PLAN.stops[0].km <= me.km + 0.05
                   && me.km < PLAN.stops[PLAN.stops.length - 1].km;
    if (inPlan){
      const i = PLAN.stops.findIndex((s, k) => k > 0 && s.km > me.km + 0.15);
      if (i > 0){
        target = PLAN.stops[i];
        label = target.type ? 'Tonight (night ' + i + ')' : 'Finish';
      }
    } else {
      const on = new Set(Object.keys(TYPES).filter(t => TYPES[t].on));
      target = rt.shelters.find(s => s.km > me.km + 0.15 && on.has(s.type)
                                     && (!s.status || s.status === 'ok'));
    }
    if (!target) return html + '<br>Nothing further along the ' + name + '.';

    // door to door: back to the route, along it, out to the hut
    const along = target.km - me.km, detour = (target.offM || 0) / 1000;
    const dKm = me.off + along + detour;
    const asc = ascentBetween(rt, me.km, target.km);
    const hours = dKm / 4 + asc.up / 600;                   // Naismith, as the day cards
    return html + '<br><b>' + label + ':</b> ' + esc(target.label)
      + '<br>' + (me.off + detour > 0.1 ? '&asymp;' : '') + fmtKm(dKm)
      + ' &middot; &uarr;' + asc.up + ' m &darr;' + asc.dn + ' m &middot; ~'
      + (hours < 1 ? Math.round(hours * 60) + ' min' : hours.toFixed(1) + ' h')
      + (target.caveat ? '<br><span class="warn">&#9888; ' + esc(target.caveat) + '</span>' : '');
  }

  map.on('locationfound', e => {
    if (!watching) return;
    last = e.latlng;
    const acc = e.accuracy || 0;
    if (!dot){
      ring = L.circle(e.latlng, {radius:acc, color:'#2e9bff', weight:1, fillColor:'#2e9bff',
                                 fillOpacity:0.12, interactive:false}).addTo(map);
      dot = L.marker(e.latlng, {icon:L.divIcon({className:'', iconSize:[16,16], iconAnchor:[8,8],
                                html:'<div class="geo-dot"></div>'}), zIndexOffset:1000,
                                interactive:false}).addTo(map);
    } else {
      dot.setLatLng(e.latlng);
      ring.setLatLng(e.latlng).setRadius(acc);
    }
    if (firstFix){ map.setView(e.latlng, Math.max(map.getZoom(), 14)); firstFix = false; }
    setChip(true, '&#9678; Tracking &middot; tap to stop');
    say(readout([e.latlng.lat, e.latlng.lng], acc, e.altitude));
  });

  map.on('locationerror', e => {
    if (!watching) return;
    const c = e.code;     // 1 permission denied, 2 unavailable, 3 timeout
    say(c === 1 ? 'Location permission was refused. Allow it for this site in the browser settings '
                  + '(on iPhone: Settings &rarr; Privacy &rarr; Location Services).'
      : c === 2 ? 'No position available. Check that location services are on.'
      : c === 3 ? 'Still waiting for a fix &mdash; step into the open and give it a minute.'
      : (e.message || 'Location failed.'), true);
    if (c !== 3){ watching = false; map.stopLocate(); setChip(false, '&#9678; My location'); }
  });
})();

// ---------------------------------------------------------------------------
// Offline.
//
// The service worker precaches this page and the data for all three routes, so
// planning works with no signal from the first visit on. Map tiles are saved
// per section on request: the corridor of the chosen stretch, 2.5 km either
// side - the same distance the planner may detour to a hut - so every place it
// can send you to is on the saved map.
//
// Tile URLs must match Leaflet's own requests exactly, subdomain included, or
// the saved tiles are never found again at runtime.
// ---------------------------------------------------------------------------
(function(){
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;

  const TILE_MAX = 4000;        // must match sw.js - beyond it the oldest tiles go
  const BUF_KM = 2.5, ZMIN = 8;
  // Measured on 161 OpenTopoMap tiles in the Pyrenees: ~50 KB up to z14, ~37 KB
  // at z15. Mountain tiles are heavier than lowland ones, so this is the honest
  // basis for the estimate.
  const tileKB = z => z >= 15 ? 37 : 50;
  let tileCount = 0, busy = false, pageSaved = null, persisted = null;

  const ctl = L.control({position:'topright'});
  ctl.onAdd = function(){
    const w = L.DomUtil.create('div');
    w.innerHTML =
      '<div id="off-chip" title="Save the map and plan with no signal">&#8681; Offline maps</div>'
    + '<div id="off-panel">'
    +   '<div id="off-status">Checking&hellip;</div>'
    +   '<div id="off-est" style="margin-top:6px"></div>'
    +   '<div><select id="off-zoom">'
    +     '<option value="14" selected>Standard detail (to zoom 14)</option>'
    +     '<option value="15">High detail (to zoom 15)</option>'
    +   '</select></div>'
    +   '<div><button id="off-go">Save map for this section</button> '
    +       '<button id="off-clear">Clear saved maps</button></div>'
    +   '<div id="off-bar"><i></i></div>'
    +   '<div id="off-note">Do this on wifi, then <b>Add to Home Screen</b> &mdash; '
    +     'iOS deletes saved data for sites that are only bookmarked.</div>'
    + '</div>';
    L.DomEvent.disableClickPropagation(w);
    L.DomEvent.disableScrollPropagation(w);
    return w;
  };
  ctl.addTo(map);

  const $ = id => document.getElementById(id);
  const chip = $('off-chip'), panel = $('off-panel'), status = $('off-status'),
        est = $('off-est'), bar = $('off-bar'), barIn = bar.firstChild,
        goBtn = $('off-go'), clrBtn = $('off-clear'), zoomSel = $('off-zoom');
  const isOpen = () => panel.style.display === 'block';

  function niceDate(iso){
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || '');
    if (!m) return iso || '?';
    return (+m[3]) + ' ' + 'Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec'.split(' ')[+m[2]-1]
         + ' ' + m[1];
  }

  // --- tile maths, mirroring Leaflet ---------------------------------------
  const lon2x = (lon, z) => Math.floor((lon + 180) / 360 * Math.pow(2, z));
  const lat2y = (lat, z) => { const r = lat * Math.PI / 180;
    return Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * Math.pow(2, z)); };

  function corridor(zMax){
    if (!(pick.start && pick.end) || !R[active] || pick.start.route !== active) return null;
    const rt = R[active];
    const pts = rt.points.slice(idxAtKm(rt, pick.start.km), idxAtKm(rt, pick.end.km) + 1);
    const seen = new Set(), urls = [];
    let kb = 0;
    for (let z = ZMIN; z <= zMax; z++){
      for (let i = 0; i < pts.length; i++){
        const lat = pts[i][0], lon = pts[i][1];
        const dlat = BUF_KM / 111.0, dlon = BUF_KM / (111.0 * Math.cos(lat * Math.PI / 180));
        const x0 = lon2x(lon - dlon, z), x1 = lon2x(lon + dlon, z);
        const y0 = lat2y(lat + dlat, z), y1 = lat2y(lat - dlat, z);
        for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++){
          const key = z + '/' + x + '/' + y;
          if (seen.has(key)) continue;
          seen.add(key);
          const s = 'abc'.charAt(Math.abs(x + y) % 3);      // Leaflet's subdomain rule
          urls.push('https://' + s + '.tile.opentopomap.org/' + key + '.png');
          kb += tileKB(z);
        }
      }
    }
    return {urls: urls, mb: kb / 1024,
            label: ROUTE_META[active].name + ' km ' + pick.start.km.toFixed(0) + '–'
                   + pick.end.km.toFixed(0)};
  }

  function drawStatus(){
    const online = navigator.onLine;
    chip.classList.toggle('offline', !online);
    chip.innerHTML = online ? '&#8681; Offline maps' : 'Offline &middot; using saved data';
    const src = SHELTER_SOURCE || {};
    status.innerHTML = (online ? 'Online' : '<b class="warn">No signal</b>')
      + ' &middot; page and hut data '
      + (pageSaved === null ? 'checking&hellip;'
         : pageSaved ? '<b>saved</b> &mdash; planning works offline'
         : '<span class="warn">not saved yet</span>')
      + '<br>Hut data: OpenStreetMap ' + niceDate(src.fetched)
      + (src.reviewed ? ', reviewed ' + niceDate(src.reviewed) : '')
      + '<br>Map tiles saved: <b>' + tileCount.toLocaleString() + '</b> of '
      + TILE_MAX.toLocaleString()
      + (persisted === true ? ' &middot; protected from clean-up' : '');
  }

  // The estimate is recomputed whenever the section changes, and the button is
  // only enabled when the download is one the cache can actually hold.
  function drawEstimate(){
    if (busy) return;
    const c = corridor(+zoomSel.value);
    goBtn.disabled = true;
    if (!c){
      est.innerHTML = '<span class="warn">Pick a start and finish first</span> &mdash; the map is '
        + 'saved for that section only, which keeps it small.';
      return;
    }
    const n = c.urls.length;
    if (n > TILE_MAX){
      est.innerHTML = '<b>' + c.label + '</b> needs <b class="bad">' + n.toLocaleString()
        + ' tiles</b> at this detail, more than the ' + TILE_MAX.toLocaleString()
        + ' that fit. Choose standard detail or a shorter section.';
      return;
    }
    est.innerHTML = '<b>' + c.label + '</b>: ' + n.toLocaleString() + ' tiles, about <b>'
      + Math.ceil(c.mb) + ' MB</b>'
      + (tileCount + n > TILE_MAX
         ? '<br><span class="warn">This may push out maps saved for other sections - never '
           + 'this one.</span>' : '');
    goBtn.disabled = !navigator.serviceWorker.controller || !navigator.onLine;
    if (!navigator.serviceWorker.controller)
      est.innerHTML += '<br><span class="warn">Offline support is still starting - reload once.</span>';
  }

  function refresh(){
    drawStatus(); drawEstimate();
    if (navigator.serviceWorker.controller)
      navigator.serviceWorker.controller.postMessage({type:'TILE_STATS'});
    caches.match('./data/shelters.json').then(hit => { pageSaved = !!hit; drawStatus(); });
    if (navigator.storage && navigator.storage.persisted)
      navigator.storage.persisted().then(p => { persisted = p; drawStatus(); });
  }
  window.__offlineRefresh = () => { if (isOpen()) drawEstimate(); };

  chip.addEventListener('click', () => {
    panel.style.display = isOpen() ? 'none' : 'block';
    if (isOpen()) refresh();
  });
  zoomSel.addEventListener('change', drawEstimate);

  goBtn.addEventListener('click', () => {
    const c = corridor(+zoomSel.value);
    if (busy || !c || c.urls.length > TILE_MAX || !navigator.serviceWorker.controller) return;
    // Ask the browser not to clear this under storage pressure. Granted for
    // installed apps and well-used sites; asking costs nothing.
    if (navigator.storage && navigator.storage.persist)
      navigator.storage.persist().then(p => { persisted = p; drawStatus(); });
    busy = true; goBtn.disabled = true; clrBtn.disabled = true;
    bar.style.display = 'block'; barIn.style.width = '0';
    est.innerHTML = 'Saving <b>' + c.label + '</b>: 0 / ' + c.urls.length.toLocaleString() + ' tiles&hellip;';
    navigator.serviceWorker.controller.postMessage({type:'TILE_PREFETCH', urls:c.urls});
  });

  clrBtn.addEventListener('click', () => {
    if (busy || !navigator.serviceWorker.controller) return;
    navigator.serviceWorker.controller.postMessage({type:'TILE_CLEAR'});
  });

  navigator.serviceWorker.addEventListener('message', e => {
    const m = e.data || {};
    if (m.type === 'TILE_STATS'){ tileCount = m.count; drawStatus(); drawEstimate(); }
    if (m.type === 'TILE_PROGRESS'){
      barIn.style.width = (100 * m.done / m.total).toFixed(1) + '%';
      est.innerHTML = 'Saving: <b>' + m.done.toLocaleString() + '</b> / '
        + m.total.toLocaleString() + ' tiles&hellip;';
    }
    if (m.type === 'TILE_DONE'){
      busy = false; clrBtn.disabled = false; bar.style.display = 'none';
      tileCount = m.count; drawStatus(); drawEstimate();
      est.innerHTML = (m.failed
          ? '<span class="warn">Saved ' + (m.done - m.failed).toLocaleString() + ' of '
            + m.total.toLocaleString() + ' tiles - ' + m.failed
            + ' failed. Press save again on a better connection to fill the gaps.</span>'
          : '<b>Saved.</b> ' + m.total.toLocaleString() + ' tiles for this section are on the device.')
        + '<br>' + est.innerHTML;
    }
  });

  window.addEventListener('online', refresh);
  window.addEventListener('offline', refresh);
  drawStatus();

  navigator.serviceWorker.register('./sw.js')
    .then(() => navigator.serviceWorker.ready)
    .then(() => { if (isOpen()) refresh(); else caches.match('./data/shelters.json')
                    .then(hit => { pageSaved = !!hit; }); })
    .catch(err => { status.innerHTML = 'Offline support unavailable: ' + esc(err.message); });
})();
</script>
</body>
</html>
