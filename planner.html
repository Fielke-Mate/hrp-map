<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Pyrenees traverse planner — GR10 · GR11 · HRP</title>
<link rel="stylesheet" href="./leaflet.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a1622;color:#d0e0f0;font:13px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
#top{padding:9px 14px;border-bottom:1px solid #1e3247;background:#0d1c2b;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
h1{font-size:15px;color:#fff;font-weight:600}
#routeToggles{display:flex;gap:6px}
.rt{border-radius:6px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer;
  border:1px solid #2a4060;background:#12253a;color:#7a9ab8;user-select:none}
.rt.on{color:#fff}
.rt .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;opacity:.35}
.rt.on .dot{opacity:1}
.rt .len{font-weight:400;font-size:10.5px;opacity:.7;margin-left:5px}
#pickState{font-size:11.5px;color:#8aa4bc;margin-left:auto;background:#122942;
  border:1px solid #243d58;border-radius:6px;padding:4px 10px}
#pickState b{color:#7ad0f0}
#controls{display:flex;flex-wrap:wrap;gap:13px;align-items:flex-end;padding:9px 14px;
  border-bottom:1px solid #1e3247;background:#0e1e2e}
.ctl{display:flex;flex-direction:column;gap:3px}
.ctl label{font-size:10px;color:#7a9ab8;text-transform:uppercase;letter-spacing:.4px}
input[type=number]{background:#0f2030;color:#d0e0f0;border:1px solid #2a4060;
  border-radius:5px;padding:5px 7px;font:inherit;font-size:12px;width:78px}
.pair{display:flex;align-items:center;gap:4px}
.pair input[type=number]{width:54px}
.pair span{color:#5d7e99;font-size:12px}
.types{display:flex;gap:7px;flex-wrap:wrap}
.types label{display:flex;align-items:center;gap:3px;font-size:11px;color:#bcd4e6;
  text-transform:none;letter-spacing:0;cursor:pointer}
button{background:#1e4a6b;color:#dff0ff;border:1px solid #3a7ca8;border-radius:6px;
  padding:7px 13px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
button:hover{background:#2a5f88}
button.sec{background:#162a3d;border-color:#2a4060;color:#9ab8d0;font-weight:500}
button:disabled{opacity:.4;cursor:default}
#main{display:flex;height:calc(100vh - 168px);min-height:360px}
#mapcol{flex:1;display:flex;flex-direction:column;min-width:0}
#map{flex:1;background:#101f2e;position:relative}
#elev{height:132px;border-top:1px solid #1e3247;background:#0c1a27;position:relative}
#elev-svg{width:100%;height:100%;display:block}
#elev .none{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#5a7a90;font-size:11.5px}
#side{width:340px;overflow-y:auto;border-left:1px solid #1e3247;background:#0b1a28}
#summary{padding:10px 12px;border-bottom:1px solid #1e3247}
#summary .big{font-size:19px;color:#fff;font-weight:600}
#summary .row{color:#8aa4bc;font-size:11px;margin-top:2px}
#msg{padding:10px 12px;font-size:11.5px;line-height:1.6}
#msg.warn{background:#3a2410;border-bottom:1px solid #8a5a20;color:#ffcf90}
#msg.err{background:#3a1616;border-bottom:1px solid #8a2020;color:#ffb0b0}
#msg.hint{background:#10283a;border-bottom:1px solid #2a4060;color:#9ab8d0}
.day{padding:9px 12px;border-bottom:1px solid #16293a;cursor:pointer}
.day:hover{background:#102030}
.day .n{font-size:10px;color:#7a9ab8;text-transform:uppercase;letter-spacing:.4px}
.day .to{font-size:13px;color:#fff;font-weight:600;margin:1px 0}
.day .st{color:#9ab8d0;font-size:11.5px}
.tag{display:inline-block;border-radius:3px;padding:0 4px;font-size:9.5px;
  font-weight:700;margin-right:4px}
.badge{border-radius:3px;width:19px;height:19px;line-height:17px;text-align:center;
  font-size:11px;font-weight:700;border:2px solid}
.pin{width:15px;height:15px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 5px #000a}
.leaflet-marker-draggable .pin{cursor:grab}
#legend{position:absolute;bottom:10px;left:10px;z-index:900;background:#12253ae6;
  border:1px solid #2a4060;border-radius:7px;padding:7px 9px;font-size:10.5px}
#legend div{display:flex;align-items:center;gap:6px;margin:2px 0}
#zoomhint{position:absolute;bottom:10px;right:10px;z-index:900;background:#12253ae6;
  border:1px solid #2a4060;border-radius:7px;padding:5px 9px;font-size:10.5px;color:#9ab8d0}
.leaflet-popup-content-wrapper{background:#1a2d3f;border:1px solid #2a4060;color:#d0e0f0}
.leaflet-popup-tip{background:#1a2d3f}
.leaflet-popup-content{font-size:12px;margin:9px 12px}
.leaflet-popup-content h4{color:#7ad0f0;font-size:12.5px;margin-bottom:3px}
.leaflet-popup-content .m{color:#9ab8d0;font-size:11px}
#locks{border-bottom:1px solid #16293a;padding:7px 10px;background:#0e1f2e}
#locks .lh{font-size:10px;color:#7a9ab8;text-transform:uppercase;letter-spacing:.4px;
  display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
#locks .lk{font-size:11.5px;color:#d0e0f0;display:flex;align-items:center;gap:6px;
  padding:2px 0;flex-wrap:wrap}
#locks .lk.out{opacity:.55}
#locks .km{color:#6a8398;font-size:10.5px}
#locks .ow{color:#ffcf90;font-size:10.5px}
#locks select{background:#15283a;color:#d0e0f0;border:1px solid #2a4060;border-radius:4px;
  font:inherit;font-size:11px;padding:1px 3px}
.lx{background:none;border:1px solid #2a4060;color:#9ab8d0;border-radius:4px;
  font:inherit;font-size:10px;padding:0 5px;cursor:pointer;line-height:15px}
.lx:hover{color:#fff;border-color:#4a9fd0}
.lk-b{background:#15283a;border:1px solid #2a4060;color:#9ab8d0;border-radius:4px;
  font:inherit;font-size:10px;padding:1px 6px;cursor:pointer;margin-top:4px}
.lk-b.on{background:#2a4a20;border-color:#50a040;color:#b0e0a0}
.lk-b:hover{border-color:#4a9fd0}
.badge.locked{box-shadow:0 0 0 2px #ffd060,0 0 5px #000a}
.badge.faint{opacity:.48}
.badge.st-gone{filter:grayscale(1);opacity:.6;text-decoration:line-through;border-style:dashed}
.badge.st-shut{box-shadow:0 0 0 2px #e05050,0 0 4px #000a}
.st{margin:5px 0 0;padding:4px 6px;border-radius:4px;font-size:11px;line-height:1.35}
.st.gone{background:#3a1416;color:#ffb0b0;border:1px solid #7a2a2e}
.st.shut{background:#3a2a10;color:#ffd590;border:1px solid #7a5a20}
.st.cav{background:#2e2a12;color:#ffe9a0;border:1px solid #5e5420}
.st code{font-size:10px;color:#c9a9a9}
</style>
</head>
<body>

<div id="top">
  <h1>Pyrenees traverse planner</h1>
  <div id="routeToggles"></div>
  <div id="pickState">Click near a route to set your <b>start</b></div>
</div>

<div id="controls">
  <div class="ctl"><label for="startKm">Start (km)</label><input type="number" id="startKm" value="0" min="0" step="1"></div>
  <div class="ctl"><label for="endKm">Finish (km)</label><input type="number" id="endKm" value="150" min="1" step="1"></div>
  <div class="ctl"><label for="minKm">Km per day · min / max</label>
    <div class="pair"><input type="number" id="minKm" value="10" min="0" step="1"
           title="shortest day you will accept, km door to door including detours">
      <span>–</span>
      <input type="number" id="maxKm" value="20" min="1" step="1"
           title="longest day you will accept, km door to door including detours"></div></div>
  <div class="ctl"><label for="minAsc">Climb per day (m) · min / max</label>
    <div class="pair"><input type="number" id="minAsc" value="0" min="0" step="100"
           title="least ascent you want in a day — 0 for no minimum">
      <span>–</span>
      <input type="number" id="maxAsc" value="1600" min="0" step="100"
           title="most ascent you will accept in a day — 0 for no limit"></div></div>
  <div class="ctl"><label>Will sleep in</label><div class="types" id="types"></div></div>
  <div class="ctl"><label>&nbsp;</label><button id="go">Plan it</button></div>
  <div class="ctl"><label>&nbsp;</label><button id="whole" class="sec">Whole route</button></div>
  <div class="ctl"><label>&nbsp;</label><button id="clear" class="sec">Reset</button></div>
  <div class="ctl"><label>&nbsp;</label><button id="gpx" class="sec">Export GPX</button></div>
</div>

<div id="main">
  <div id="mapcol">
    <div id="map"><div id="legend"></div><div id="zoomhint"></div></div>
    <div id="elev"><svg id="elev-svg"></svg><div class="none" id="elev-none">Pick a start and finish to see the profile</div></div>
  </div>
  <div id="side">
    <div id="summary"><div class="big">Loading…</div></div>
    <div id="msg"></div>
    <div id="locks"></div>
    <div id="days"></div>
  </div>
</div>

<script src="./leaflet.js"></script>
<script>
// ---------------------------------------------------------------------------
// Pyrenees traverse planner.
//
// A route is one polyline; everything else is an interval or a point measured
// in km along it. Days are derived from the chosen stops, never stored, which
// is what lets one geometry serve any start, finish and daily range.
// ---------------------------------------------------------------------------

const TYPES = {
  R: {label:'Staffed refuge',  bg:'#1a7a40', bd:'#80f0b0', fg:'#fff', on:true},
  C: {label:'Unattended hut',  bg:'#b85e10', bd:'#ffd080', fg:'#fff', on:true},
  A: {label:'Bare shelter',    bg:'#5a3060', bd:'#c080ff', fg:'#ddb0ff', on:true},
  G: {label:'Gîte / albergue', bg:'#1c5c8a', bd:'#7ad0f0', fg:'#fff', on:true},
  B: {label:'Campsite',        bg:'#4a6a20', bd:'#b0e060', fg:'#fff', on:true},
  H: {label:'Hotel / guesthouse', bg:'#5a5a5a', bd:'#a0a0a0', fg:'#ddd', on:false}
};
// H is off by default: excluding it leaves GR10's worst gap unchanged at
// 13.4 km, and it clutters every village.

const ROUTE_META = {
  hrp:  {name:'HRP',  full:'Haute Randonnée Pyrénéenne', colour:'#7ad0f0', on:true},
  gr10: {name:'GR10', full:'GR 10 — French side',        colour:'#f0a050', on:false},
  gr11: {name:'GR11', full:'GR 11 — Spanish side',       colour:'#e070c0', on:false}
};
const SHELTER_ZOOM = 10;      // below this the badges merge into a solid mass
const SNAP_PX = 44;           // a click this close to a route counts as on it
const DAY_COLOURS = ['#4a9fd0','#e05030','#e09020','#20a060','#9040d0','#d04090',
                     '#40b0a0','#c0a020','#7060d0','#d06040'];
const dayColour = i => DAY_COLOURS[i % DAY_COLOURS.length];

const map = L.map('map', {zoomControl:true}).setView([42.75, 0.6], 8);
L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
  attribution:'Kartendaten: © OpenStreetMap-Mitwirkende, SRTM | Kartendarstellung: © OpenTopoMap (CC-BY-SA)',
  crossOrigin:true, maxZoom:17, opacity:0.85
}).addTo(map);

const R = {};                          // loaded routes by id
let SHELTERS = null;
let active = 'hrp';                    // the route being planned
let pick = {start:null, end:null};     // {route, km}
let PLAN = null;
let LOCKS = [];                        // {route, id, km, label, type, night|null}
const lines = {};
const layers = {shelters:L.layerGroup().addTo(map), stops:L.layerGroup().addTo(map),
                pins:L.layerGroup().addTo(map)};

function kmBetween(a, b){
  const dlat = (b[0]-a[0])*111.0;
  const dlon = (b[1]-a[1])*111.0*Math.cos((a[0]+b[0])/2*Math.PI/180);
  return Math.sqrt(dlat*dlat + dlon*dlon);
}
function esc(t){ return String(t == null ? '' : t)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function idxAtKm(rt, km){
  const c = rt.cum;
  let lo = 0, hi = c.length - 1;
  while (lo < hi){ const m = (lo+hi)>>1; if (c[m] < km) lo = m+1; else hi = m; }
  return lo;
}
function eleAtKm(rt, km){
  const i = idxAtKm(rt, km), p = rt.points, c = rt.cum;
  if (i <= 0) return p[0][2];
  const span = c[i] - c[i-1], t = span > 0 ? (km - c[i-1]) / span : 0;
  return p[i-1][2] + t * (p[i][2] - p[i-1][2]);
}
function llAtKm(rt, km){
  const i = idxAtKm(rt, km), p = rt.points, c = rt.cum;
  if (i <= 0) return [p[0][0], p[0][1]];
  const span = c[i] - c[i-1], t = span > 0 ? (km - c[i-1]) / span : 0;
  return [p[i-1][0] + t*(p[i][0]-p[i-1][0]), p[i-1][1] + t*(p[i][1]-p[i-1][1])];
}
// Resampled to a fixed interval before the 3 m threshold, so the figure does
// not grow with how densely the track happens to be sampled.
function ascentBetween(rt, a, b){
  let up = 0, dn = 0, prev = eleAtKm(rt, a);
  for (let k = a + 0.025; k <= b; k += 0.025){
    const e = eleAtKm(rt, k), d = e - prev;
    if (Math.abs(d) > 3){ if (d > 0) up += d; else dn -= d; prev = e; }
  }
  return {up:Math.round(up), dn:Math.round(dn)};
}
function nearestKmOn(rt, ll){
  let best = Infinity, bi = 0;
  const step = 4;
  for (let i = 0; i < rt.points.length; i += step){
    const d = kmBetween(ll, rt.points[i]);
    if (d < best){ best = d; bi = i; }
  }
  for (let i = Math.max(0, bi-step); i < Math.min(rt.points.length, bi+step+1); i++){
    const d = kmBetween(ll, rt.points[i]);
    if (d < best){ best = d; bi = i; }
  }
  return {km: rt.cum[bi], off: best};
}

// --- the planner ----------------------------------------------------------
// Candidate stops form a DAG ordered by km; an edge exists where the day
// between them satisfies every constraint; the itinerary is the cheapest
// path. Greedy "walk the target distance, take the nearest hut" paints itself
// into corners and leaves an impossible final day.
//
// Locked stops add two constraints. Every lock is *required*: no edge may step
// over it, which forces all paths through it. A lock may further be *pinned*
// to a night number, and that needs the night count as a second state
// dimension - "the cheapest way to reach this hut" and "the cheapest way to
// reach it on night 3" are different questions with different answers. The
// dimension is only allocated when something is actually pinned, so an
// unpinned plan costs exactly what it did before.
function autoPlan(rt, startKm, endKm, opts){
  const allLocks = opts.locks || [];
  const locks = allLocks.filter(l => l.km > startKm + 0.3 && l.km < endKm - 0.3);
  const lockIds = new Set(locks.map(l => l.id));
  // A locked stop is honoured even if its type is switched off or it lies
  // beyond the detour limit: the user asked for it by name.
  // Never choose a night at a hut recorded as closed or private, and never at
  // one that is ruined or demolished - even when asked: a lock can pick a
  // closed or private hut (the hiker may know the shepherd), but not a ruin.
  // A record without a status predates the check and is treated as usable.
  const usable = s => !s.status || s.status === 'ok';
  const cand = rt.shelters.filter(s => s.km > startKm + 0.3 && s.km < endKm - 0.3
                                  && s.status !== 'gone'
                                  && ((opts.types.has(s.type) && s.offM <= opts.maxOffM
                                       && usable(s))
                                      || lockIds.has(s.id)));
  const nodes = [{km:startKm, offM:0, label:'Start', type:null}]
    .concat(cand).concat([{km:endKm, offM:0, label:'Finish', type:null}]);
  const N = nodes.length, INF = Infinity;

  const required = new Uint8Array(N);
  const pinnedAt = new Int16Array(N).fill(-1);
  locks.forEach(l => {
    const i = nodes.findIndex(n => n.id === l.id);
    if (i < 0) return;
    required[i] = 1;
    if (l.night != null) pinnedAt[i] = l.night;
  });
  // The next required node strictly after i, so an edge that steps over a
  // lock can be rejected outright rather than priced.
  const nextReq = new Int32Array(N).fill(N);
  for (let i = N - 2; i >= 0; i--) nextReq[i] = required[i+1] ? i+1 : nextReq[i+1];

  const dayOf = (a, b) => {
    const trackKm = nodes[b].km - nodes[a].km;
    const detour = (nodes[a].offM + nodes[b].offM) / 1000;
    const asc = ascentBetween(rt, nodes[a].km, nodes[b].km);
    return {trackKm, detour, km:trackKm + detour, up:asc.up, dn:asc.dn};
  };
  const ideal = (opts.minKm + opts.maxKm) / 2;

  // useDim  carry the night count as state (needed to honour a pin at all)
  // applyPins  enforce the pins; off for the diagnosis pass, which answers
  //            "which nights could this hut fall on?"
  function solve(useDim, applyPins){
    const D = useDim ? Math.min(N, Math.ceil((endKm - startKm) / Math.max(1, opts.minKm))
                                   + locks.length + 2) : 1;
    const cost = new Float64Array(N * D).fill(INF);
    const prev = new Int32Array(N * D).fill(-1);
    cost[0] = 0;
    // The outer loop is in km order, which is topological order for this DAG,
    // so every predecessor of i is final by the time i is reached.
    for (let i = 0; i < N; i++){
      let live = false;
      for (let d = 0; d < D; d++) if (cost[i*D + d] < INF){ live = true; break; }
      if (!live) continue;
      // Edges out of i depend only on geometry, never on the night number, so
      // they are built once and reused across the night dimension. Computing
      // them inside the night loop instead re-walks the elevation profile D
      // times per edge, which took a whole-route pinned plan from 0.2 s to 42 s.
      const stop = Math.min(N, nextReq[i] + 1);
      const ej = [], ec = [];
      for (let j = i + 1; j < stop; j++){
        const d = dayOf(i, j);
        if (d.trackKm > opts.maxKm) break;
        if (d.km > opts.maxKm) continue;
        // A lock may make a short day - it was asked for by name.
        if (d.km < opts.minKm && j < N - 1 && !required[i] && !required[j]) continue;
        if (opts.maxAsc > 0 && d.up > opts.maxAsc) continue;
        // Minimums are about the day being worth having, so the last day into
        // the finish is exempt - you arrive where you arrive.
        if (opts.minAsc > 0 && d.up < opts.minAsc && j < N - 1
            && !required[i] && !required[j]) continue;
        ej.push(j);
        ec.push(Math.abs(d.km - ideal) + (nodes[j].offM / 1000) * 2
                + (opts.maxAsc > 0 ? Math.max(0, d.up - opts.maxAsc*0.85) / 120 : 0));
      }
      for (let di = 0; di < D; di++){
        const ci = cost[i*D + di];
        if (ci === INF) continue;
        const dj = useDim ? di + 1 : 0;
        if (dj >= D) continue;
        for (let e = 0; e < ej.length; e++){
          const j = ej[e];
          if (applyPins && pinnedAt[j] >= 0 && pinnedAt[j] !== dj) continue;
          const t = j*D + dj;
          if (ci + ec[e] < cost[t]){ cost[t] = ci + ec[e]; prev[t] = i*D + di; }
        }
      }
    }
    let end = -1;
    for (let d = 0; d < D; d++){
      const s = (N-1)*D + d;
      if (cost[s] < INF && (end < 0 || cost[s] < cost[end])) end = s;
    }
    return {D:D, cost:cost, prev:prev, end:end};
  }

  const anyPin = locks.some(l => l.night != null);
  const res = solve(anyPin, anyPin);

  if (res.end < 0){
    // Diagnose without the pins, so the report blames the geography when the
    // geography is at fault and the pin when the pin is.
    const diag = anyPin ? solve(true, false) : res;
    const reach = i => {
      const out = [];
      for (let d = 0; d < diag.D; d++) if (diag.cost[i*diag.D + d] < INF) out.push(d);
      return out;
    };
    if (anyPin){
      for (let i = 0; i < N; i++){
        if (pinnedAt[i] < 0) continue;
        const ok = reach(i);
        if (ok.length && ok.indexOf(pinnedAt[i]) < 0)
          return {ok:false, kind:'pin', node:nodes[i], want:pinnedAt[i], nights:ok};
      }
    }
    let far = 0;
    for (let i = 0; i < N; i++)
      if (reach(i).length && nodes[i].km > nodes[far].km) far = i;
    // Why can nothing follow `far`? Classify the candidates in reach instead
    // of reporting only the first that breaks a maximum: with minimums in
    // play the real obstacle is often "everything close enough is too easy".
    const options = [];
    for (let j = far + 1; j < N; j++){
      const d = dayOf(far, j), why = [];
      if (d.km > opts.maxKm) why.push('distance');
      else if (d.km < opts.minKm && j < N - 1) why.push('short');
      if (opts.maxAsc > 0 && d.up > opts.maxAsc) why.push('climb');
      else if (opts.minAsc > 0 && d.up < opts.minAsc && j < N - 1) why.push('flat');
      if (why.length) options.push({node:nodes[j], d:d, why:why});
      if (d.trackKm > opts.maxKm) break;      // past everything in reach
    }
    // A gap you cannot bridge is a harder fact than a day that is too easy,
    // so a maximum leads the report where one is broken.
    let best = options.find(o => o.why.indexOf('distance') >= 0
                              || o.why.indexOf('climb') >= 0) || options[0];
    if (!best) best = {node:nodes[N-1], d:dayOf(far, N-1), why:['distance']};
    return {ok:false, kind:'gap', stuckAt:nodes[far], next:best.node, day:best.d,
            reasons:best.why, options:options,
            lock:(nextReq[far] < N && nextReq[far] <= nodes.indexOf(best.node))
                 ? nodes[nextReq[far]] : null};
  }

  const path = [];
  for (let s = res.end; s >= 0; s = res.prev[s]){
    const i = Math.floor(s / res.D);
    path.unshift(nodes[i]);
    if (i === 0) break;
  }
  const days = [];
  for (let i = 1; i < path.length; i++){
    const a = path[i-1], b = path[i];
    const trackKm = b.km - a.km, detour = (a.offM + b.offM)/1000;
    const asc = ascentBetween(rt, a.km, b.km);
    days.push({from:a, to:b, trackKm, detour, km:trackKm+detour, up:asc.up, dn:asc.dn,
               hours:(trackKm+detour)/4 + asc.up/600});
  }
  return {ok:true, stops:path, days:days,
          ignored:allLocks.filter(l => !lockIds.has(l.id))};
}

// --- locked stops ---------------------------------------------------------
// A lock survives every change to the daily range, the shelter types and the
// section, because the whole point is "re-plan around this".
function lockOf(id){ return LOCKS.find(l => l.id === id && l.route === active); }
function toggleLock(id, night){
  const i = LOCKS.findIndex(l => l.id === id && l.route === active);
  if (i >= 0) LOCKS.splice(i, 1);
  else {
    const s = (R[active] || {shelters:[]}).shelters.find(x => x.id === id);
    if (!s || s.status === 'gone') return;      // a ruin is never a stop
    LOCKS.push({route:active, id:id, km:s.km, label:s.label, type:s.type,
                night:(night == null ? null : +night)});
  }
  map.closePopup();
  replan(); drawShelters();
}
function setLockNight(id, v){
  const l = lockOf(id);
  if (!l) return;
  l.night = (v === '' ? null : +v);
  replan();
}
function clearLocks(){
  LOCKS = LOCKS.filter(l => l.route !== active);
  replan(); drawShelters();
}

function drawLocks(){
  const box = document.getElementById('locks');
  const mine = LOCKS.filter(l => l.route === active).sort((a,b) => a.km - b.km);
  if (!mine.length){ box.innerHTML = ''; box.style.display = 'none'; return; }
  box.style.display = '';
  const lo = pick.start ? pick.start.km : -Infinity;
  const hi = pick.end ? pick.end.km : Infinity;
  const nights = (PLAN && PLAN.ok) ? PLAN.days.length : 1;
  box.innerHTML = '<div class="lh"><span>Locked stops</span>'
    + '<button class="lx" onclick="clearLocks()">clear all</button></div>'
    + mine.map(l => {
        const out = !(l.km > lo + 0.3 && l.km < hi - 0.3);
        let sel = '<select onchange="setLockNight(\'' + l.id + '\', this.value)">'
          + '<option value=""' + (l.night == null ? ' selected' : '') + '>any night</option>';
        for (let n = 1; n <= Math.max(nights, l.night || 0); n++)
          sel += '<option value="' + n + '"' + (l.night === n ? ' selected' : '')
               + '>night ' + n + '</option>';
        sel += '</select>';
        return '<div class="lk' + (out ? ' out' : '') + '">'
          + '<button class="lx" onclick="toggleLock(\'' + l.id + '\')" title="remove">x</button>'
          + '<b>' + esc(l.label) + '</b><span class="km">km ' + l.km.toFixed(1) + '</span>'
          + (out ? '<span class="ow">outside your section - ignored</span>' : sel)
          + '</div>';
      }).join('');
}

// --- rendering ------------------------------------------------------------
function badge(t, locked, faint, status){
  const s = TYPES[t] || TYPES.A;
  const st = status === 'gone' ? ' st-gone'
           : (status === 'closed' || status === 'private') ? ' st-shut' : '';
  return L.divIcon({className:'', iconSize:[19,19], iconAnchor:[9.5,9.5],
    html:'<div class="badge' + (locked ? ' locked' : '') + (faint ? ' faint' : '') + st
         + '" style="background:'+s.bg
         +';border-color:'+s.bd+';color:'+s.fg+'">'+t+'</div>'});
}
function pinIcon(colour){
  return L.divIcon({className:'', iconSize:[15,15], iconAnchor:[7.5,7.5],
    html:'<div class="pin" style="background:'+colour+'"></div>'});
}

let selLine = null;
function drawRoutes(){
  Object.keys(ROUTE_META).forEach(id => {
    if (lines[id]){ map.removeLayer(lines[id]); delete lines[id]; }
    const meta = ROUTE_META[id];
    if (!meta.on || !R[id]) return;
    const isActive = id === active;
    // Every route that is switched on is drawn at the same strength. The
    // chosen section reads as the subject because selLine is drawn over it at
    // twice the width, not by making the other lines hard to see - dimming
    // the active route to 0.3 left it fainter than routes merely toggled on.
    const ranged = isActive && pick.start && pick.end;
    lines[id] = L.polyline(R[id].points.map(p => [p[0], p[1]]), {
      color: meta.colour,
      weight: isActive ? (ranged ? 3 : 4) : 3,
      opacity: isActive ? (ranged ? 0.8 : 0.95) : 0.8
    }).addTo(map);
  });
  if (selLine){ map.removeLayer(selLine); selLine = null; }
  if (pick.start && pick.end && R[active]){
    const rt = R[active];
    const seg = rt.points.slice(idxAtKm(rt, pick.start.km), idxAtKm(rt, pick.end.km) + 1)
                         .map(p => [p[0], p[1]]);
    if (seg.length > 1){
      selLine = L.polyline(seg, {color:ROUTE_META[active].colour, weight:6, opacity:1}).addTo(map);
    }
  }
}

// What a hiker must know about a hut before relying on it, worded for the
// trail. statusWhy entries are either a reviewed reason or the OSM tag that
// decided it; both are shown so the judgement can be checked, not just taken.
function statusNote(s){
  const why = (s.statusWhy || []).map(w => {
    const m = w.match(/^reviewed (\S+): (.*)$/);
    return m ? esc(m[2]) + ' <code>(reviewed ' + m[1] + ')</code>' : '<code>' + esc(w) + '</code>';
  }).join('<br>');
  if (s.status === 'gone')
    return '<div class="st gone"><b>Not a place to sleep</b> — reported ruined, demolished or '
      + 'abandoned. The planner will never use it.' + (why ? '<br>' + why : '') + '</div>';
  if (s.status === 'closed')
    return '<div class="st shut"><b>Reported closed</b> — the planner will not choose it. '
      + 'Lock it only if you know it is open.' + (why ? '<br>' + why : '') + '</div>';
  if (s.status === 'private')
    return '<div class="st shut"><b>Private</b> — not open to the public, so the planner will '
      + 'not choose it.' + (why ? '<br>' + why : '') + '</div>';
  if (s.caveat)
    return '<div class="st cav">⚠ ' + esc(s.caveat) + '</div>';
  return '';
}

function drawShelters(){
  layers.shelters.clearLayers();
  const hint = document.getElementById('zoomhint');
  if (!R[active]) return;
  if (map.getZoom() < SHELTER_ZOOM){
    hint.textContent = 'Zoom in to see places to sleep';
    return;
  }
  const on = new Set(Object.keys(TYPES).filter(t => TYPES[t].on));
  const b = map.getBounds();
  // Every route that is switched on contributes its places to sleep, not only
  // the one being planned. Drawing just the active route's meant that panning
  // along a stretch where the other two run showed an empty map - 48 huts in
  // view and nothing on screen.
  const vis = Object.keys(ROUTE_META).filter(id => ROUTE_META[id].on && R[id]);
  // A hut can serve more than one route, so collect by id and keep every
  // projection instead of stamping it down two or three times.
  const byId = new Map();
  vis.forEach(id => {
    R[id].shelters.forEach(s => {
      if (!b.contains(L.latLng(s.ll[0], s.ll[1]))) return;
      let e = byId.get(s.id);
      if (!e){ e = {s: s, on: []}; byId.set(s.id, e); }
      e.on.push({route: id, km: s.km, offM: s.offM});
    });
  });
  // The picked section is still the subject: what sits inside it on the route
  // being planned stays at full strength, everything else recedes. Receding is
  // not the same as hiding, which is where this went wrong before.
  const lo = (pick.start && pick.end) ? pick.start.km - 1 : -Infinity;
  const hi = (pick.start && pick.end) ? pick.end.km + 1 : Infinity;
  const inFocus = e => e.on.some(o => o.route === active && o.km >= lo && o.km <= hi);

  let items = [];
  byId.forEach(e => { if (on.has(e.s.type) || lockOf(e.s.id)) items.push(e); });
  // Several hundred divIcons make panning sticky, so when the view is that
  // wide keep the ones that bear on the plan and say how many were dropped.
  const CAP = 320;
  let hidden = 0;
  if (items.length > CAP){
    const keep = items.filter(inFocus);
    const shown = keep.length ? keep.slice(0, CAP) : items.slice(0, CAP);
    hidden = items.length - shown.length;
    items = shown;
  }

  items.forEach(e => {
    const s = e.s, lk = lockOf(s.id), focus = inFocus(e);
    const mine = e.on.some(o => o.route === active);
    L.marker(s.ll, {icon: badge(s.type, !!lk, !focus && !lk, s.status)})
     .bindPopup('<h4>' + esc(s.label) + '</h4><p class="m">'
       + (TYPES[s.type] ? TYPES[s.type].label : s.type)
       + (s.ele ? ' · ' + s.ele + ' m' : '')
       // name every route it serves, with that route's own km
       + '<br>' + e.on.map(o => ROUTE_META[o.route].name + ' km ' + o.km.toFixed(1)
           + ' · ' + o.offM + ' m off route').join('<br>')
       + (s.capacity ? '<br>capacity ' + esc(s.capacity) : '')
       + (s.confidence !== 'high' ? '<br><i>classified from incomplete tags ('
           + s.confidence + ' confidence)</i>' : '')
       + '<br><span style="color:#6a8398">' + esc(s.id) + '</span></p>'
       + statusNote(s)
       // Locking works against the route being planned, so offer it only there
       // rather than leaving a button that silently does nothing - and never
       // for a ruin.
       + (s.status === 'gone' ? '' : mine
          ? '<p style="margin:5px 0 0"><button class="lk-b' + (lk ? ' on' : '')
            + '" onclick="toggleLock(\'' + s.id + '\')">'
            + (lk ? 'unlock this stop' : 'lock as a stop') + '</button></p>'
          : '<p class="m" style="margin:5px 0 0">Not on ' + ROUTE_META[active].name
            + ' — click that route\'s line to plan on it</p>'))
     .addTo(layers.shelters);
  });

  const counts = vis.map(id => items.filter(e => e.on.some(o => o.route === id)).length);
  const per = vis.map((id, k) => counts[k] + ' ' + ROUTE_META[id].name).join(' · ');
  // The per-route counts can add up to more than the total, because a hut
  // within 2.5 km of two routes serves both. Say so rather than leaving the
  // arithmetic looking broken.
  const shared = counts.reduce((a, c) => a + c, 0) - items.length;
  hint.textContent = items.length + ' places to sleep in view · ' + per
    + (shared > 0 ? ' · ' + shared + ' shared' : '')
    + (hidden ? ' · ' + hidden + ' more, zoom in' : '');
}

function drawPins(){
  layers.pins.clearLayers();
  ['start','end'].forEach(k => {
    const p = pick[k];
    if (!p || !R[p.route]) return;
    const name = k === 'start' ? 'Start' : 'Finish';
    const m = L.marker(llAtKm(R[p.route], p.km),
             {icon:pinIcon(k === 'start' ? '#50d080' : '#e05050'), zIndexOffset:900,
              draggable:true, autoPan:true});
    m.bindTooltip(name + ' · km ' + p.km.toFixed(1) + ' — drag to move',
                  {direction:'top', offset:[0,-11]});
    // Live readout while dragging, snapped to the route, so you can see where
    // you are landing before letting go.
    m.on('drag', () => {
      const ll = m.getLatLng();
      m.setTooltipContent(name + ' · km '
        + nearestKmOn(R[p.route], [ll.lat, ll.lng]).km.toFixed(1));
    });
    // On release the pin returns to the line. It means "this point on the
    // route", so leaving it on a hillside would be a lie about the distance.
    m.on('dragend', () => {
      const ll = m.getLatLng();
      const km = nearestKmOn(R[p.route], [ll.lat, ll.lng]).km;
      if (k === 'start' && !pick.end){
        pick.start = {route:p.route, km:km};
        syncInputs(); drawRoutes(); drawPins(); drawShelters(); render();
        return;
      }
      let a = (k === 'start') ? km : pick.start.km;
      let b = (k === 'start') ? pick.end.km : km;
      if (b < a){ const t = a; a = b; b = t; }   // dragged past the other pin
      pick = {start:{route:p.route, km:a}, end:{route:p.route, km:b}};
      syncInputs(); replan();
    });
    m.addTo(layers.pins);
  });
}

function setPick(id, km){
  if (!R[id]) return;
  active = id;                                 // choosing a point plans on it
  if (!pick.start || pick.start.route !== id || pick.end){
    pick = {start:{route:id, km:km}, end:null};
    PLAN = null;
  } else {
    const a = Math.min(pick.start.km, km), b = Math.max(pick.start.km, km);
    pick = {start:{route:id, km:a}, end:{route:id, km:b}};
  }
  syncInputs(); drawPins(); updateToggles();
  if (pick.start && pick.end){
    replan();                       // which refreshes the lines and shelters
  } else {
    drawRoutes(); drawShelters(); render();
  }
}

// Hitting a 2 px line exactly is unreasonable, and worse on a phone, so any
// click within SNAP_PX of a visible route snaps onto it. The tolerance is in
// screen pixels rather than km so it feels the same at every zoom - at zoom 8
// a fixed 1 km would be invisible, at zoom 15 it would swallow the screen.
function onMapClick(latlng){
  let best = null;
  Object.keys(ROUTE_META).forEach(id => {
    if (!ROUTE_META[id].on || !R[id]) return;
    const hit = nearestKmOn(R[id], [latlng.lat, latlng.lng]);
    if (!best || hit.off < best.off) best = {id:id, km:hit.km, off:hit.off};
  });
  if (!best) return;
  const ll = llAtKm(R[best.id], best.km);
  const px = map.latLngToContainerPoint(latlng)
                .distanceTo(map.latLngToContainerPoint(L.latLng(ll[0], ll[1])));
  if (px > SNAP_PX){
    // Say how far off it was rather than ignoring the click silently.
    const st = document.getElementById('pickState');
    st.innerHTML = '<span style="color:#ffcf90">That spot is '
      + (best.off < 1 ? Math.round(best.off * 1000) + ' m' : best.off.toFixed(1) + ' km')
      + ' from the nearest route — click closer to the line</span>';
    clearTimeout(onMapClick._t);
    onMapClick._t = setTimeout(syncInputs, 2800);
    return;
  }
  setPick(best.id, best.km);
}

// A real reset. The old handler cleared the pins but never called
// drawRoutes(), so the base line stayed dimmed to 0.3 with the previous
// selection still drawn heavy on top of it - which looks exactly like the
// route disappearing. Locked stops survive; they have their own clear all.
function resetAll(){
  pick = {start:null, end:null};
  PLAN = null;
  const rt = R[active];
  const set = (id, v) => { document.getElementById(id).value = v; };
  set('startKm', 0);
  set('endKm', rt ? Math.min(150, Math.floor(rt.lengthKm)) : 150);
  set('minKm', 10); set('maxKm', 20);
  set('minAsc', 0); set('maxAsc', 1600);
  syncInputs(); drawRoutes(); drawPins(); drawShelters(); render();
}

function syncInputs(){
  if (pick.start) document.getElementById('startKm').value = pick.start.km.toFixed(1);
  if (pick.end)   document.getElementById('endKm').value   = pick.end.km.toFixed(1);
  const st = document.getElementById('pickState');
  if (!pick.start) st.innerHTML = 'Click near a route to set your <b>start</b>';
  else if (!pick.end) st.innerHTML = 'Start <b>' + ROUTE_META[pick.start.route].name
    + ' km ' + pick.start.km.toFixed(1) + '</b> — now click your <b>finish</b>'
    + ' <span style="color:#6a8398">(or drag the green pin)</span>';
  else st.innerHTML = '<b>' + ROUTE_META[active].name + '</b> km '
    + pick.start.km.toFixed(1) + ' → ' + pick.end.km.toFixed(1)
    + ' <span style="color:#6a8398">(' + (pick.end.km - pick.start.km).toFixed(0) + ' km)</span>';
}

function setActive(id){
  if (!ROUTE_META[id].on || !R[id]) return;
  active = id;
  if (pick.start && pick.start.route !== id){ pick = {start:null, end:null}; PLAN = null; }
  drawRoutes(); updateToggles(); drawShelters(); syncInputs(); drawPins(); render();
}

function updateToggles(){
  document.querySelectorAll('.rt').forEach(el => {
    const id = el.dataset.r;
    const on = !!ROUTE_META[id].on, isActive = id === active && on;
    el.classList.toggle('on', on);
    el.style.borderColor = isActive ? ROUTE_META[id].colour : '#2a4060';
    el.style.boxShadow = isActive ? ('inset 0 -2px 0 ' + ROUTE_META[id].colour) : 'none';
    el.title = ROUTE_META[id].full + (on ? (isActive ? ' — planning on this'
      : ' — shown; click its line on the map to plan on it') : ' — hidden');
    const len = el.querySelector('.len');
    if (len) len.textContent = R[id] ? R[id].lengthKm.toFixed(0) + ' km' : '';
  });
}

function render(){
  const sum = document.getElementById('summary'), msg = document.getElementById('msg'),
        list = document.getElementById('days');
  layers.stops.clearLayers();
  list.innerHTML = ''; msg.className = ''; msg.innerHTML = '';
  document.getElementById('gpx').disabled = !(PLAN && PLAN.ok);
  const rt = R[active];
  drawLocks();

  if (!PLAN){
    sum.innerHTML = '<div class="big">' + (rt ? ROUTE_META[active].name : '—') + '</div>'
      + (rt ? '<div class="row">' + ROUTE_META[active].full + '</div><div class="row">'
            + rt.lengthKm.toFixed(0) + ' km · ' + rt.shelters.length
            + ' places to sleep within 2.5 km</div>' : '');
    msg.className = 'hint';
    msg.innerHTML = 'Click <b>anywhere near a route</b> to drop your <b>start</b>, then click '
      + 'again for your <b>finish</b> — you do not have to hit the line exactly, and either pin '
      + 'can be dragged afterwards. You can also type kilometres above.<br><br>'
      + 'The toggles at the top show or hide each route, so you can have all three up at once; '
      + 'the one you click on is the one you plan on.';
    drawProfile();
    return;
  }
  if (!PLAN.ok){
    sum.innerHTML = '<div class="big">No plan possible</div>';
    drawProfile();
    msg.className = 'err';
    if (PLAN.kind === 'limits'){
      msg.innerHTML = PLAN.detail + ' Nothing can satisfy both — adjust one of them.';
      return;
    }
    if (PLAN.kind === 'pin'){
      const ns = PLAN.nights.filter(n => n > 0);
      let when;
      if (ns.length > 4) when = 'nights ' + ns[0] + '-' + ns[ns.length-1];
      else if (ns.length === 1) when = 'night ' + ns[0];
      else when = 'night ' + ns.slice(0, -1).join(', ') + ' or ' + ns[ns.length-1];
      msg.innerHTML = '<b>' + esc(PLAN.node.label) + '</b> cannot be night ' + PLAN.want
        + '. Within your daily limits it falls on ' + when
        + '. Change the night, or widen the daily range.';
      return;
    }
    const d = PLAN.day, why = PLAN.reasons, bits = [];
    if (why.indexOf('distance') >= 0)
      bits.push('<b>' + d.km.toFixed(1) + ' km</b> door to door'
        + (d.detour > 0.05 ? ' (' + d.trackKm.toFixed(1) + ' km on the route plus '
            + (d.detour*1000).toFixed(0) + ' m of detours)' : '')
        + ', above your ' + document.getElementById('maxKm').value + ' km maximum');
    if (why.indexOf('climb') >= 0)
      bits.push('<b>' + d.up + ' m</b> of climb, above your '
        + document.getElementById('maxAsc').value + ' m limit');
    if (why.indexOf('short') >= 0)
      bits.push('only <b>' + d.km.toFixed(1) + ' km</b>, below your '
        + document.getElementById('minKm').value + ' km minimum');
    if (why.indexOf('flat') >= 0)
      bits.push('only <b>' + d.up + ' m</b> of climb, below your '
        + document.getElementById('minAsc').value + ' m minimum');
    msg.innerHTML = 'Stuck after <b>' + esc(PLAN.stuckAt.label) + '</b> (km '
      + PLAN.stuckAt.km.toFixed(1) + '). The next place you could sleep is <b>'
      + esc(PLAN.next.label) + '</b> at km ' + PLAN.next.km.toFixed(1) + ' — '
      + bits.join(', and ') + '.<br>Try: '
      + [].concat(
          why.indexOf('distance') >= 0 ? ['raise the daily maximum past ' + Math.ceil(d.km) + ' km'] : [],
          why.indexOf('climb') >= 0 ? ['raise the climb limit past ' + d.up + ' m'] : [],
          why.indexOf('short') >= 0 ? ['lower the daily minimum below ' + Math.floor(d.km) + ' km'] : [],
          why.indexOf('flat') >= 0 ? ['lower the climb minimum below ' + d.up + ' m'] : [],
          ['allow more shelter types', 'or plan a bivouac there']).join(', ') + '.'
      + blockedByMinimums()
      + (PLAN.lock ? '<br>This step is forced by your locked stop at <b>'
          + esc(PLAN.lock.label) + '</b> — unlock it to let the planner choose.' : '');
    return;
  }
  const tot = PLAN.days.reduce((a,d) => a + d.km, 0);
  const up = PLAN.days.reduce((a,d) => a + d.up, 0);
  sum.innerHTML = '<div class="big">' + PLAN.days.length + ' days · ' + tot.toFixed(0) + ' km</div>'
    + '<div class="row">↑ ' + up.toLocaleString() + ' m · '
    + PLAN.days.reduce((a,d)=>a+d.hours,0).toFixed(0) + ' h walking (Naismith)</div>'
    + '<div class="row">' + ROUTE_META[active].full + ' · km '
    + PLAN.stops[0].km.toFixed(0) + '–' + PLAN.stops[PLAN.stops.length-1].km.toFixed(0) + '</div>';

  PLAN.days.forEach((d, i) => {
    const el = document.createElement('div');
    el.className = 'day';
    const t = d.to.type;
    el.style.borderLeft = '3px solid ' + dayColour(i);
    el.innerHTML = '<div class="n">Day ' + (i+1) + '</div>'
      + '<div class="to">' + (t ? '<span class="tag" style="background:'+TYPES[t].bg
          +';color:'+TYPES[t].fg+'">'+t+'</span>' : '') + esc(d.to.label) + '</div>'
      + '<div class="st">' + d.km.toFixed(1) + ' km · ↑' + d.up + ' m · ↓' + d.dn + ' m · ~'
      + d.hours.toFixed(1) + ' h'
      + (d.detour > 0.05 ? '<br><span style="color:#ffcf90">includes '
          + (d.detour*1000).toFixed(0) + ' m off route</span>' : '')
      + (d.to.ele ? '<br>' + d.to.ele + ' m · km ' + d.to.km.toFixed(1) : '')
      // a locked stop may be closed or private; an ordinary one may carry a
      // caveat - either way the hiker reads it here, not only in a popup
      + (d.to.id ? statusNote(d.to) : '')
      + (d.to.id ? '<br><button class="lk-b' + (lockOf(d.to.id) ? ' on' : '')
          + '" onclick="event.stopPropagation();toggleLock(\'' + d.to.id + '\','
          + (i+1) + ')">' + (lockOf(d.to.id) ? 'locked to night ' + (i+1)
                                             : 'keep as night ' + (i+1)) + '</button>' : '')
      + '</div>';
    el.onclick = () => map.fitBounds(
      L.latLngBounds(llAtKm(rt, d.from.km), llAtKm(rt, d.to.km)), {padding:[45,45]});
    list.appendChild(el);
  });
  PLAN.stops.forEach((s, i) => {
    if (!s.type) return;
    const lk = lockOf(s.id);
    L.marker(s.ll || llAtKm(rt, s.km), {icon:badge(s.type, !!lk, false, s.status), zIndexOffset:600})
     .bindPopup('<h4>Night ' + i + ' — ' + esc(s.label) + '</h4>'
       + '<p style="margin:5px 0 0"><button class="lk-b' + (lk ? ' on' : '')
       + '" onclick="toggleLock(\'' + s.id + '\',' + i + ')">'
       + (lk ? 'unlock' : 'keep this as night ' + i) + '</button></p>')
     .addTo(layers.stops);
  });
  drawProfile();
  const low = PLAN.stops.filter(s => s.confidence && s.confidence !== 'high');
  if (low.length){
    msg.className = 'warn';
    msg.innerHTML = '⚠ ' + low.length + ' of your stops ' + (low.length===1?'is':'are')
      + ' classified from incomplete OSM tags: ' + low.map(s=>esc(s.label)).join(', ')
      + '. Treat the type as a best guess and check before relying on it.';
  }
}

// When a minimum is what rules out the near options, saying so is the
// difference between "the mountains are too hard" and "your floor is too high".
function blockedByMinimums(){
  if (!PLAN || PLAN.ok || !PLAN.options) return '';
  const only = PLAN.options.filter(o =>
    o.why.length && o.why.every(w => w === 'short' || w === 'flat'));
  if (!only.length) return '';
  // A village can hold four bordas at the same spot; listing all of them is
  // four names for one decision, so keep one per distinct day.
  const seen = new Set(), uniq = [];
  only.forEach(o => {
    const k = o.d.km.toFixed(1) + '/' + o.d.up;
    if (!seen.has(k)){ seen.add(k); uniq.push(o); }
  });
  return '<br>Closer options exist but your minimums rule them out: '
    + uniq.slice(0, 3).map(o => esc(o.node.label) + ' (' + o.d.km.toFixed(1)
        + ' km, ↑' + o.d.up + ' m)').join(', ') + '.';
}

// Distance along the x axis, not point index, and one coloured band per day -
// the same shape as the earlier HRP tool, which read well.
function drawProfile(){
  const svg = document.getElementById('elev-svg');
  const none = document.getElementById('elev-none');
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  if (!PLAN || !PLAN.ok || !R[active]){ none.style.display = 'flex'; return; }
  none.style.display = 'none';
  const rt = R[active];
  const bb = svg.getBoundingClientRect();
  const W = Math.max(320, bb.width || 900), H = Math.max(90, bb.height || 130);
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  const ns = 'http://www.w3.org/2000/svg';
  const mk = (tag, at) => { const e = document.createElementNS(ns, tag);
    Object.keys(at).forEach(k => e.setAttribute(k, at[k])); return e; };
  const PL = 40, PR = 10, PT = 16, PB = 20;
  const a = PLAN.stops[0].km, b = PLAN.stops[PLAN.stops.length-1].km;
  const span = b - a;
  const N = Math.max(200, Math.min(1400, Math.round(span * 6)));
  const xs = [], es = [];
  for (let i = 0; i <= N; i++){
    const km = a + span * i / N;
    xs.push(km); es.push(eleAtKm(rt, km));
  }
  let mn = Infinity, mx = -Infinity;
  es.forEach(e => { if (e < mn) mn = e; if (e > mx) mx = e; });
  if (mx - mn < 50) mx = mn + 50;
  const sx = km => PL + (km - a) / span * (W - PL - PR);
  const sy = e => H - PB - (e - mn) / (mx - mn) * (H - PT - PB);

  // one filled band per day
  PLAN.days.forEach((d, di) => {
    let path = 'M' + sx(d.from.km) + ',' + (H - PB);
    for (let i = 0; i <= N; i++){
      if (xs[i] < d.from.km || xs[i] > d.to.km) continue;
      path += ' L' + sx(xs[i]).toFixed(1) + ',' + sy(es[i]).toFixed(1);
    }
    path += ' L' + sx(d.to.km) + ',' + (H - PB) + ' Z';
    svg.appendChild(mk('path', {d:path, fill:dayColour(di), opacity:0.72}));
    // boundary tick and day number
    svg.appendChild(mk('line', {x1:sx(d.to.km), y1:PT-4, x2:sx(d.to.km), y2:H-PB,
      stroke:'#8aa4bc', 'stroke-width':0.7, 'stroke-dasharray':'2,3', opacity:0.6}));
    const w = sx(d.to.km) - sx(d.from.km);
    if (w > 26){
      const t = mk('text', {x:(sx(d.from.km)+sx(d.to.km))/2, y:PT-4,
        fill:'#cfe3f5', 'font-size':9.5, 'text-anchor':'middle'});
      t.textContent = 'D' + (di+1);
      svg.appendChild(t);
    }
  });
  // outline
  let ol = 'M' + sx(xs[0]) + ',' + sy(es[0]);
  for (let i = 1; i <= N; i++) ol += ' L' + sx(xs[i]).toFixed(1) + ',' + sy(es[i]).toFixed(1);
  svg.appendChild(mk('path', {d:ol, fill:'none', stroke:'#eaf4ff',
    'stroke-width':1, opacity:0.55}));

  // axes
  [mn, (mn+mx)/2, mx].forEach(e => {
    svg.appendChild(mk('line', {x1:PL, y1:sy(e), x2:W-PR, y2:sy(e),
      stroke:'#2a4060', 'stroke-width':0.6, opacity:0.7}));
    const t = mk('text', {x:PL-5, y:sy(e)+3, fill:'#7a9ab8', 'font-size':9, 'text-anchor':'end'});
    t.textContent = Math.round(e) + 'm';
    svg.appendChild(t);
  });
  const stepKm = span > 300 ? 50 : span > 120 ? 20 : span > 40 ? 10 : 5;
  for (let km = Math.ceil(a/stepKm)*stepKm; km <= b; km += stepKm){
    const t = mk('text', {x:sx(km), y:H-6, fill:'#7a9ab8', 'font-size':9, 'text-anchor':'middle'});
    t.textContent = Math.round(km) + 'km';
    svg.appendChild(t);
  }
}

function replan(){
  const rt = R[active];
  if (!rt){ PLAN = null; render(); return; }
  const types = new Set(Object.keys(TYPES).filter(t => TYPES[t].on));
  const a = Math.max(0, +document.getElementById('startKm').value);
  const b = Math.min(rt.lengthKm, +document.getElementById('endKm').value);
  if (!(b > a)){ PLAN = null; render(); return; }
  pick = {start:{route:active, km:a}, end:{route:active, km:b}};
  const minKm  = +document.getElementById('minKm').value;
  const maxKm  = +document.getElementById('maxKm').value;
  const minAsc = +document.getElementById('minAsc').value;
  const maxAsc = +document.getElementById('maxAsc').value;
  // Catch a contradictory range here rather than letting the planner grind to
  // "no plan possible", which would blame the mountains for a typo.
  if (minKm > maxKm)
    PLAN = {ok:false, kind:'limits', detail:'Your shortest day (' + minKm
            + ' km) is longer than your longest day (' + maxKm + ' km).'};
  else if (minAsc > 0 && maxAsc > 0 && minAsc > maxAsc)
    PLAN = {ok:false, kind:'limits', detail:'Your least climb (' + minAsc
            + ' m) is more than your most climb (' + maxAsc + ' m).'};
  else
    PLAN = autoPlan(rt, a, b, {types, maxOffM:2500,
      locks:LOCKS.filter(l => l.route === active),
      minKm:minKm, maxKm:maxKm, minAsc:minAsc, maxAsc:maxAsc});
  syncInputs(); drawRoutes(); drawPins(); drawShelters(); render();
}

function exportGPX(){
  if (!PLAN || !PLAN.ok) return;
  const rt = R[active];
  const a = PLAN.stops[0].km, b = PLAN.stops[PLAN.stops.length-1].km;
  const pts = rt.points.slice(idxAtKm(rt, a), idxAtKm(rt, b) + 1);
  const out = ['<?xml version="1.0" encoding="UTF-8"?>',
    '<gpx version="1.1" creator="Pyrenees traverse planner" xmlns="http://www.topografix.com/GPX/1/1">',
    '  <metadata><name>' + esc(ROUTE_META[active].full) + ' km ' + a.toFixed(0) + '–'
      + b.toFixed(0) + '</name><time>' + new Date().toISOString().replace(/\.\d+Z$/,'Z')
      + '</time></metadata>'];
  PLAN.stops.forEach((s, i) => {
    if (!s.type) return;
    const ll = s.ll || llAtKm(rt, s.km);
    out.push('  <wpt lat="' + ll[0].toFixed(6) + '" lon="' + ll[1].toFixed(6) + '">'
      + (s.ele ? '<ele>' + s.ele + '</ele>' : '')
      + '<name>' + esc('Night ' + i + ' – ' + s.label) + '</name><sym>Lodging</sym></wpt>');
  });
  out.push('  <trk><name>' + esc(ROUTE_META[active].full) + '</name><trkseg>');
  pts.forEach(p => out.push('    <trkpt lat="' + p[0].toFixed(6) + '" lon="' + p[1].toFixed(6)
    + '"><ele>' + p[2] + '</ele></trkpt>'));
  out.push('    </trkseg>', '  </trk>', '</gpx>');
  const blob = new Blob([out.join('\n')], {type:'application/gpx+xml'});
  const url = URL.createObjectURL(blob);
  const el = document.createElement('a');
  el.href = url; el.download = active + '-km' + a.toFixed(0) + '-' + b.toFixed(0) + '.gpx';
  document.body.appendChild(el); el.click(); document.body.removeChild(el);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

async function ensureRoute(id){
  if (R[id]) return R[id];
  const r = await fetch('./data/routes/' + id + '.json').then(x => x.json());
  const cum = [0];
  for (let i = 1; i < r.points.length; i++) cum.push(cum[i-1] + kmBetween(r.points[i-1], r.points[i]));
  const shelters = [];
  SHELTERS.forEach(s => {
    const o = s.on.find(o => o.route === id);
    if (o) shelters.push({id:s.id, label:s.label, type:s.type, ele:s.ele,
                          capacity:s.capacity, confidence:s.confidence,
                          status:s.status || 'ok', statusWhy:s.statusWhy || [],
                          caveat:s.caveat || null,
                          ll:s.ll, km:o.km, offM:o.offM});
  });
  shelters.sort((a,b) => a.km - b.km);
  R[id] = {id:r.id, name:r.name, points:r.points, cum,
           lengthKm:cum[cum.length-1], stages:r.stages, shelters};
  return R[id];
}

(async function init(){
  const tbox = document.getElementById('types');
  Object.keys(TYPES).forEach(t => {
    const l = document.createElement('label');
    l.innerHTML = '<input type="checkbox" data-t="' + t + '"' + (TYPES[t].on ? ' checked' : '')
      + '> <span class="badge" style="display:inline-block;background:' + TYPES[t].bg
      + ';border-color:' + TYPES[t].bd + ';color:' + TYPES[t].fg + '">' + t + '</span>';
    l.title = TYPES[t].label;
    tbox.appendChild(l);
  });
  document.getElementById('legend').innerHTML = Object.keys(TYPES).map(t =>
    '<div><span class="badge" style="background:' + TYPES[t].bg + ';border-color:' + TYPES[t].bd
    + ';color:' + TYPES[t].fg + '">' + t + '</span> ' + TYPES[t].label + '</div>').join('')
    + '<div><span class="badge st-shut" style="background:' + TYPES.C.bg + ';border-color:'
    + TYPES.C.bd + ';color:' + TYPES.C.fg + '">C</span> closed or private</div>'
    + '<div><span class="badge st-gone" style="background:' + TYPES.C.bg + ';border-color:'
    + TYPES.C.bd + ';color:' + TYPES.C.fg + '">C</span> ruined / demolished</div>';

  const tg = document.getElementById('routeToggles');
  Object.keys(ROUTE_META).forEach(id => {
    const m = ROUTE_META[id];
    const b = document.createElement('div');
    b.className = 'rt'; b.dataset.r = id; b.title = m.full;
    b.innerHTML = '<span class="dot" style="background:' + m.colour + '"></span>'
      + m.name + '<span class="len"></span>';
    // The toggle controls VISIBILITY only. Which route you are planning is a
    // separate thing, set by clicking a line on the map - one button doing
    // both jobs made showing all three feel like the routes excluded one
    // another.
    b.onclick = async () => {
      m.on = !m.on;
      if (m.on) await ensureRoute(id);
      if (!ROUTE_META[active].on){
        const other = Object.keys(ROUTE_META).find(k => ROUTE_META[k].on);
        if (other){
          active = other;
          if (pick.start && pick.start.route !== active){
            pick = {start:null, end:null}; PLAN = null;
          }
        }
      }
      drawRoutes(); updateToggles(); drawShelters(); syncInputs(); drawPins(); render();
    };
    b.oncontextmenu = e => { e.preventDefault(); if (ROUTE_META[id].on) setActive(id); };
    tg.appendChild(b);
  });

  SHELTERS = await fetch('./data/shelters.json').then(x => x.json()).then(d => d.shelters);
  await ensureRoute('hrp');
  drawRoutes(); updateToggles();
  map.fitBounds(lines.hrp.getBounds(), {padding:[20,20]});
  drawShelters();
  document.getElementById('endKm').value = Math.min(150, Math.floor(R.hrp.lengthKm));
  replan();

  document.getElementById('go').onclick = replan;
  document.getElementById('gpx').onclick = exportGPX;
  document.getElementById('clear').onclick = resetAll;
  document.getElementById('whole').onclick = () => {
    document.getElementById('startKm').value = 0;
    document.getElementById('endKm').value = Math.floor(R[active].lengthKm);
    replan();
    if (lines[active]) map.fitBounds(lines[active].getBounds(), {padding:[20,20]});
  };
  tbox.onchange = e => { TYPES[e.target.dataset.t].on = e.target.checked; drawShelters(); replan(); };
  ['startKm','endKm','minKm','maxKm','minAsc','maxAsc'].forEach(id =>
    document.getElementById(id).onchange = replan);
  // One handler on the map rather than one per line: a click anywhere snaps to
  // the nearest visible route, so the line no longer has to be hit exactly.
  map.on('click', e => onMapClick(e.latlng));
  map.on('moveend', drawShelters);
  window.addEventListener('resize', () => { drawProfile(); });
  window.__plannerReady = true;
})();
</script>
